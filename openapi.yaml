  /files:
    post:
      summary: Create a new file
      description: Allows the storage of files for later use.
      tags:
        - Files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content:
                  title: Binary File
                  description: Binary file content to be stored.
                  type: string
                file:
                  $ref: '#/components/schemas/files.multipart-data'
              required:
                - content
            examples:
              multipart:
                description: 'Content-Type: multipart/form-data; boundary=3bb873df66f5202e15d4b3b9a7eff'
                value: "--3bb873df66f5202e15d4b3b9a7eff\r\nContent-Disposition: form-data; name=\"file\"\r\nContent-Type: application/json\r\n\r\n{\n  \"mimeType\": \"image/png\",\n  \"name\": \"my-image.png\"\n}\r\n--3bb873df66f5202e15d4b3b9a7eff\r\nContent-Disposition: form-data; name=\"content\"; filename=\"original-name.png\"\r\nContent-Type: image/png\r\n\r\nBINARY-CONTENT\r\n--3bb873df66f5202e15d4b3b9a7eff--\r\n\r\n"
          application/json:
            schema:
              $ref: '#/components/schemas/files.file'
          '*/*':
            schema:
              title: Binary File
              description: |-
                The entire request body will be the file content to be stored.
                                        <br><br>The main usage for this is for easier binary content streaming in the applications using this API.
              type: string
            examples:
              binary:
                description: 'Content-Type: image/png'
                value: BINARY-CONTENT
      responses:
        '201':
          description: Created file
          headers:
            Location:
              description: The URL for created file object.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/files.file'
        default:
          $ref: '#/components/responses/error'
      x-code-samples:
        - lang: Shell
          label: 'Bash: multipart with data'
          source: |
            curl 'https://api.zenvia.com/v2/files' \
            -H 'X-API-TOKEN: YOUR_API_TOKEN' \
            -F 'file={
              "mimeType": "image/png",
              "name": "my-image.png"
            };type=application/json' \
            -F 'content=@./image-source.png'
        - lang: Shell
          label: 'Bash: multipart'
          source: |
            curl 'https://api.zenvia.com/v2/files' \
            -H 'X-API-TOKEN: YOUR_API_TOKEN' \
            -F 'content=@./image-source.png;type=image/png;filename=my-image.png'
        - lang: Shell
          label: 'Bash: raw multipart with data'
          source: |
            curl 'https://api.zenvia.com/v2/files' \
            -H 'X-API-TOKEN: YOUR_API_TOKEN' \
            -H 'Content-Type: multipart/form-data; boundary=3bb873df66f5202e15d4b3b9a7eff' \
            --data-binary "`echo -e '--3bb873df66f5202e15d4b3b9a7eff\r
            Content-Disposition: form-data; name="file"\r
            Content-Type: application/json\r
            \r
            {
              "mimeType": "text/plain",
              "name": "my-text.txt"
            }\r
            --3bb873df66f5202e15d4b3b9a7eff\r
            Content-Disposition: form-data; name="content"; filename="original-name.txt"\r
            Content-Type: text/plain\r
            \r
            BINARY-CONTENT\r
            --3bb873df66f5202e15d4b3b9a7eff--\r
            '`"
        - lang: Shell
          label: 'Bash: URL'
          source: |
            curl 'https://api.zenvia.com/v2/files' \
            -H 'X-API-TOKEN: YOUR_API_TOKEN' \
            -H 'Content-Type: application/json' \
            -d '{
              "sourceUrl": "https://zenvia.com/example",
              "sourceHeaders": {
                "Authorization": "Basic dXNlcjpwd2Q=",
                "X-Custom-Token": "TOKEN"
              },
              "mimeType": "image/png",
              "name": "my-image.png"
            }'
        - lang: Shell
          label: 'Bash: binary'
          source: |
            curl 'https://api.zenvia.com/v2/files' \
            -H 'X-API-TOKEN: YOUR_API_TOKEN' \
            -H 'Content-Type: image/png' \
            -H 'Content-Disposition: inline;filename=my-image.png' \
            --data-binary '@./image-source.png'
