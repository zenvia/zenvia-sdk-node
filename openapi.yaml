    templates.components.email.index:
      type: object
      title: Email
      description: |-
        E-mail specific fields.
                        <br>*Only applicable to [E-Mail](#tag/E-Mail) channel.*
      properties:
        replyTo:
          allOf:
            - $ref: '#/components/schemas/content.email.reply-to'
    templates.components.footer.index:
      title: Footer
      description: |-
        Template footer.
                        <br>*Only applicable to [WhatsApp](#tag/WhatsApp) and [RCS](#tag/RCS) channels.*
      type: object
      required:
        - type
        - text
      properties:
        type:
          title: Footer type
          description: The footer can only be a fixed text
          type: string
          enum:
            - TEXT_FIXED
        text:
          title: Footer text
          type: string
    templates.components.header.index:
      title: Header
      description: |-
        Template header. This will be used as subject in the [E-Mail](#tag/E-Mail) channel.
                        <br>*Only applicable to [WhatsApp](#tag/WhatsApp), [RCS](#tag/RCS) and [E-Mail](#tag/E-Mail) channels.*
      type: object
      required:
        - type
      properties:
        type:
          type: string
          title: Header type
          description: |-
            The header can have an image, document or text.
                                <br>*Only applicable to [WhatsApp](#tag/WhatsApp) and [RCS](#tag/RCS) and [E-Mail](#tag/E-Mail) channels.*
          enum:
            - MEDIA_DOCUMENT
            - MEDIA_IMAGE
            - MEDIA_VIDEO
            - TEXT_FIXED
            - TEXT_TEMPLATE
        text:
          type: string
          title: Header text
          description: 'Body header. This will be used as subject in the [E-Mail](#tag/E-Mail) channel.<br>In other channels it will be a title above the body.'
    templates.components.otp.base:
      type: object
      properties:
        type:
          title: Content type
          description: 'Set to COPY_CODE if you want the template to use a copy code button, or ONE_TAP to use an one-tap autofill button'
          type: string
        copyButtonText:
          description: 'Note that even if your template is using a one-tap autofill button, this value must still be supplied. If we are unable to validate your handshake the authentication template message will display a copy code button with this text instead.'
          type: string
          minLength: 1
          maxLength: 25
        addSecurityRecommendation:
          description: 'Set to true if you want the template to include the text: "For your security, do not share this code". Set to false to exclude the text.'
          type: boolean
        codeExpirationMinutes:
          description: 'Indicates number of minutes the password or code is valid. If omitted, the code expiration warning will not be displayed in the delivered message.'
          type: number
          minimum: 1
          maximum: 90
      required:
        - type
        - copyButtonText
    templates.components.otp.copy-code:
      type: object
      allOf:
        - $ref: '#/components/schemas/templates.components.otp.base'
      example:
        type: COPY_CODE
        copyButtonText: Copy the code
        addSecurityRecommendation: true
        codeExpirationMinutes: 5
    templates.components.otp.index:
      title: OTP
      description: |-
        Template OTP button. A copy code button copies the one-time password or code to the user's clipboard. The user can then manually switch to your app and paste the password or code into your app's interface. A one-tap autofill button automatically loads and passes your app the one-time password or code. Currently, ONE_TAP buttons only work for Android. On IOS systems it will work as a COPY_CODE button.
                        <br>*Only applicable to [WhatsApp](#tag/WhatsApp) channel.*
      type: object
      oneOf:
        - $ref: '#/components/schemas/templates.components.otp.one-tap'
        - $ref: '#/components/schemas/templates.components.otp.copy-code'
      required:
        - type
      discriminator:
        propertyName: type
        mapping:
          ONE_TAP: '#/components/schemas/templates.components.otp.one-tap'
          COPY_CODE: '#/components/schemas/templates.components.otp.copy-code'
    templates.components.otp.one-tap:
      type: object
      allOf:
        - $ref: '#/components/schemas/templates.components.otp.base'
        - type: object
          properties:
            autofillText:
              description: One-tap button text.
              type: string
              minLength: 1
              maxLength: 25
            packageName:
              description: Your Android app's package name.
              type: string
            signatureHash:
              description: Your app signing key hash.
              type: string
          required:
            - type
            - copyButtonText
            - autofillText
            - packageName
            - signatureHash
      example:
        type: ONE_TAP
        copyButtonText: Copy the code
        addSecurityRecommendation: true
        codeExpirationMinutes: 5
        autofillText: autofill
        packageName: com.example.myapplication
        signatureHash: K8a%2FAINcGX7
    templates.create.all:
