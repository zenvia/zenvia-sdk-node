      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/content.text'
          file: '#/components/schemas/content.file'
          replyable_text: '#/components/schemas/content.replyable-text'
          card: '#/components/schemas/content.card'
          carousel: '#/components/schemas/content.carousel'
          optin_request: '#/components/schemas/content.optin_request'
    content.rcs.all:
      title: RCS
      oneOf:
        - $ref: '#/components/schemas/content.text'
        - $ref: '#/components/schemas/content.file'
        - $ref: '#/components/schemas/content.card'
        - $ref: '#/components/schemas/content.carousel'
        - $ref: '#/components/schemas/content.replyable-text'
        - $ref: '#/components/schemas/content.template'
        - $ref: '#/components/schemas/content.location'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/content.text'
          template: '#/components/schemas/content.template'
          file: '#/components/schemas/content.file'
          card: '#/components/schemas/content.card'
          carousel: '#/components/schemas/content.carousel'
          replyable_text: '#/components/schemas/content.replyable-text'
          location: '#/components/schemas/content.location'
    content.rcs.mo:
      title: RCS
      oneOf:
        - $ref: '#/components/schemas/content.text'
        - $ref: '#/components/schemas/content.file'
        - $ref: '#/components/schemas/content.card'
        - $ref: '#/components/schemas/content.carousel'
        - $ref: '#/components/schemas/content.replyable-text'
        - $ref: '#/components/schemas/content.template'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/content.text'
          template: '#/components/schemas/content.template'
          file: '#/components/schemas/content.file'
          card: '#/components/schemas/content.card'
          carousel: '#/components/schemas/content.carousel'
          replyable_text: '#/components/schemas/content.replyable-text'
    content.sms.all:
      title: SMS
      oneOf:
        - $ref: '#/components/schemas/content.sms.text'
        - $ref: '#/components/schemas/content.template'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/content.sms.text'
          template: '#/components/schemas/content.template'
    content.sms.text:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.text'
        - type: object
          properties:
            encodingStrategy:
              type: string
              enum:
                - AUTO
                - MORE_CHARACTER_SUPPORT
                - MORE_CHARACTERS_PER_MESSAGE
              default: AUTO
              description: |-
                The method used for selecting the message encoding used to dispatch the message to the provider.
                          <br>
                          <br>The default value **AUTO** will select the encoding method based on the text content, so this is only necessary
                          if you need to enforce **MORE_CHARACTERS_PER_MESSAGE** method (not recommended regarding readability), or to enforce **MORE_CHARACTER_SUPPORT**
                          if you have any trouble with **AUTO**.
                          <br>
                          <br>More information about SMS encoding can be found in the [SMS limitations](#section/SMS-limitations) section.
                          <br>
                          <br>*Only applicable to [SMS](#tag/SMS) channel.*
              example: AUTO
            reportId:
              type: number
              description: |-
                An ID used for report purposes only (also known as aggregate id). It must be setup before use.
                          <br>*Only applicable to [SMS](#tag/SMS) channel.*
              example: 12345
              minimum: -2147483648
              maximum: 2147483647
            popUpOnScreen:
              x-unpublished: true
              deprecated: true
              type: boolean
              default: false
              description: |-
                When **true**, the message will pop up on screen (also known as flash message).
                          <br>*Only applicable to [SMS](#tag/SMS) channel.*
