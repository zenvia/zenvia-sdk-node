        - $ref: '#/components/parameters/templates.category'
        - $ref: '#/components/parameters/templates.status'
        - $ref: '#/components/parameters/templates.page'
        - $ref: '#/components/parameters/templates.size'
      responses:
        '200':
          description: Template Object List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/templates.create.all'
          headers:
            x-total:
              schema:
                description: The total number of results available.
                type: string
                example: '100'
            x-page-size:
              schema:
                description: The number of results per page.
                type: string
                example: '10'
            x-page:
              schema:
                description: The current page.
                type: string
                example: '5'
        default:
          $ref: '#/components/responses/error'
  '/templates/{templateId}':
    get:
      description: Retrieve one template by id
      tags:
        - Templates
      responses:
        '200':
          description: Template Object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/templates.create.all'
        default:
          $ref: '#/components/responses/error'
    delete:
      description: Delete one template by id
      tags:
        - Templates
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/error'
    patch:
      description: Update one template by id
      tags:
        - Templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/templates.partial-template'
      responses:
        '200':
          description: Template Object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/templates.create.all'
        default:
          $ref: '#/components/responses/error'
    parameters:
      - $ref: '#/components/parameters/templateId'
  '/templates/{templateId}/comments':
    post:
      description: Create a new comment
      tags:
        - Templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/templates.template-comment'
      responses:
        '200':
          description: Created comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/templates.template-comment'
        default:
          $ref: '#/components/responses/error'
    get:
      description: List all comments
      tags:
        - Templates
      responses:
        '200':
          description: Comment Object List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/templates.template-comment'
        default:
          $ref: '#/components/responses/error'
    parameters:
      - $ref: '#/components/parameters/templateId'
  '/templates/{templateId}/comments/{templateCommentId}':
    delete:
      description: Delete comment by id
      tags:
        - Templates
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/error'
    parameters:
      - $ref: '#/components/parameters/templateId'
      - $ref: '#/components/parameters/templateCommentId'
components:
  schemas:
    2fa.configuration.requests.all:
      title: Token configuration
      description: Token configuration to generate and deliver tokens
      type: object
      properties:
        token:
          $ref: '#/components/schemas/2fa.configuration.requests.token'
        verify:
          $ref: '#/components/schemas/2fa.configuration.requests.verify'
        delivery:
          $ref: '#/components/schemas/2fa.configuration.requests.delivery'
        content:
          $ref: '#/components/schemas/2fa.configuration.requests.content'
        website:
          $ref: '#/components/schemas/2fa.configuration.requests.website'
      required:
        - token
        - content
    2fa.configuration.requests.content:
      title: SMS and E-mail Content
      type: object
      description: 'Content with SMS and e-mail information and default locale, it''s necessary to create configuration for at least one locale'
      properties:
        default:
          title: Locale
          type: string
          example: pt_br
          description: The default locale of the configuration
          enum:
            - be
            - be_by
            - bn
            - bg
            - bg_bg
            - ca
            - ca_es
            - cs
            - cs_cz
            - da
            - da_dk
            - de
            - de_ch
            - de_de
            - el
            - el_gr
            - en
            - en_au
            - en_be
            - en_gb
            - en_jp
            - en_us
            - en_za
            - es
            - es_ar
            - es_es
            - es_mx
            - fr
            - fr_ca
            - fr_fr
            - hi
            - it
            - it_it
            - nl
            - nl_be
            - nl_nl
            - pl
            - pl_pl
            - pt
            - pt_br
            - pt_pt
            - sh
            - sh_sp
            - sk
            - sk_sk
            - sv
            - sv_se
        pt_br:
          title: SMS and E-mail configuration
          type: object
          $ref: '#/components/schemas/2fa.configuration.requests.locale'
      required:
        - default
    2fa.configuration.requests.delivery:
      title: Delivery properties
      type: object
      description: Delivery properties
      properties:
        maxAttempts:
          title: Max Attempts
          type: number
          description: Max attempts a user can request to receive a token
          default: 1
          minimum: 1
          maximum: 5
        minIntervalSeconds:
          title: Min Interval In Seconds
          type: number
          description: Minimum interval in seconds that a user is required to wait to be able to request a resend of the token
          default: 60
          minimum: 60
          maximum: 120
    2fa.configuration.requests.email:
      title: Email configuration
      description: Information to send the token using E-mail
      type: object
      properties:
        from:
          description: Email sender id
          type: string
        type:
          default: email
          type: string
          description: Type of message to be sent
          example: email
        subject:
          type: string
          description: The E-mail subject
          example: Authentication code
          minLength: 1
        html:
          type: string
          description: Default text to be sent
          default: 'Hello {{name}}! Your code is {{code}}'
      required:
        - from
        - subject
    2fa.configuration.requests.locale:
      title: Configurations by locales
      description: It's possible to configure different settings to different locations. It's required to configure at least one channel `(sms or email)`
      type: object
      properties:
        sms:
          title: SMS config
          description: SMS configuration details
          type: object
          $ref: '#/components/schemas/2fa.configuration.requests.sms'
        email:
          title: E-mail config
          description: Email configuration details
          type: object
          $ref: '#/components/schemas/2fa.configuration.requests.email'
    2fa.configuration.requests.patch-config:
      title: Patch configuration
      type: object
      description: Patch configuration
      properties:
        op:
          type: string
          description: Token configuration update operation type
          enum:
            - replace
            - add
            - remove
          example: replace
        path:
          type: string
          description: The path inside the token configuration object
          example: /token
        value:
          type: object
          description: 'The value to replace, add, or remove'
          example:
            size: 6
            mode: NUMBER
            case: UPPER_ONLY
      required:
        - op
        - path
        - value
    2fa.configuration.requests.sms:
      title: SMS configuration
      description: Information to send the token using SMS
      type: object
      properties:
        from:
          type: string
          example: '559999999999'
          description: SMS sender id
        type:
          default: text
          type: string
          description: Type of message to be sent
          example: text
        text:
          type: string
          description: Default text to be sent
          default: 'Hello {{name}}! Your code is {{code}}'
      required:
        - from
    2fa.configuration.requests.token:
      title: Token properties
      description: Information about the token properties
      type: object
      properties:
        size:
          title: Token size
          type: number
          description: Number of characters of the token to be sent to the user
          example: 6
          maximum: 12
          minimum: 6
        mode:
          title: Token mode
          type: string
          description: The type of the token to be sent
          enum:
            - NUMBER
            - ALPHANUMERIC
            - ALPHANUMERIC_SUBSET
          default: NUMBER
          example: NUMBER
        case:
          title: String case type
          description: Type of the token case
          type: string
          enum:
            - UPPER_ONLY
            - LOWER_ONLY
            - MIXED
          default: UPPER_ONLY
          example: UPPER_ONLY
      required:
        - size
    2fa.configuration.requests.verify:
      title: Verification properties
      type: object
      description: Verification properties
      properties:
        maxAttempts:
          type: number
          description: Possible number of attempts for user to verify a token
          default: 3
          minimum: 3
        expireMinutes:
          type: number
          description: Time to expire token in minutes
          default: 1
          minimum: 1
          maximum: 10
    2fa.configuration.requests.website:
      title: Website domains
      description: Information needed to use this two factor authentication API service on a website
      type: object
      properties:
        domains:
          title: List of Domains
          type: array
          description: List of client domains allowed to use the two-factor authentication service
          items:
            type: string
          example:
            - app.zenvia.com
        websiteKey:
          type: string
          description: The platform generates a key that the client's frontend must use to identify itself
          readOnly: true
          example: XXXXXXXXXXXXXX
    2fa.configuration.responses.base:
      title: Token Configuration Creation
      type: array
      description: Token configuration created response
      items:
        type: object
        properties:
          id:
            title: Token Configuration Id
            type: string
            description: The configuration's unique Id
            example: 11401560-bffb-4ef3-a08e-989a15ed3c32
          token:
            $ref: '#/components/schemas/2fa.configuration.requests.token'
          verify:
            $ref: '#/components/schemas/2fa.configuration.requests.verify'
          delivery:
            $ref: '#/components/schemas/2fa.configuration.requests.delivery'
          content:
            $ref: '#/components/schemas/2fa.configuration.requests.content'
          website:
            $ref: '#/components/schemas/2fa.configuration.requests.website'
          createdAt:
            title: Creation Timestamp
            description: Timestamp of the configuration token creation
            type: string
            example: '2022-10-27T13:25:11.354Z'
          updatedAt:
            title: Update timestamp
            description: Timestamp of the token updates
            type: string
            example: '2022-10-27T13:25:11.354Z'
    2fa.configuration.responses.token-created:
      title: Token Configuration Creation
      type: object
      description: Token configuration created response
      properties:
        id:
          title: Token Configuration Id
          type: string
          description: The configuration's unique Id
          example: 11401560-bffb-4ef3-a08e-989a15ed3c32
        token:
          $ref: '#/components/schemas/2fa.configuration.requests.token'
        verify:
          $ref: '#/components/schemas/2fa.configuration.requests.verify'
        delivery:
          $ref: '#/components/schemas/2fa.configuration.requests.delivery'
        content:
          $ref: '#/components/schemas/2fa.configuration.requests.content'
        website:
          $ref: '#/components/schemas/2fa.configuration.requests.website'
        createdAt:
          title: Creation Timestamp
          description: Timestamp of the configuration token creation
          type: string
          example: '2022-10-27T13:25:11.354Z'
        updatedAt:
          title: Update timestamp
          description: Timestamp of the token updates
          type: string
          example: '2022-10-27T13:25:11.354Z'
    2fa.configuration.responses.websitekey-recreated:
      title: Token Configuration Creation
      type: object
      description: Token configuration created response
      properties:
        websiteKey:
          type: string
          description: The platform generates a key that the client's frontend must use to identify itself
          readOnly: true
          example: XXXXXXXXXXXXXX
    2fa.token.requests.code:
      title: code
      type: object
      description: Code sent by the user
      properties:
        code:
          type: string
          description: Code sent by the user
          example: '269878'
    2fa.token.requests.recipient:
      type: object
      properties:
        to:
          type: string
          description: User recipient
          example: email@email.com
        channel:
          type: string
          description: Channel used
          example: email
        code:
          type: string
          description: Code sent by the user
          example: '269878'
      required:
        - to
        - channel
        - code
    2fa.token.requests.to-channel:
      type: object
      properties:
        to:
          type: string
          description: User recipient
          example: email@email.com
        channel:
          type: string
          description: Channel used to send the token
          example: email
      required:
        - to
        - channel
    2fa.token.requests.token:
      type: object
      properties:
        configurationId:
          type: string
          description: Unique configuration Id
          example: 0f25c816-478d-4729-a600-b6b0124b4b9e
        to:
          description: Contact number or e-mail to send the token
          type: string
          example: '5511999999999'
        channel:
          description: Channel to be used to send the token
          type: string
          enum:
            - sms
            - email
          example: sms
        locale:
          description: 'Choose one configured locale, if left blank the default locale will be used'
          type: string
          example: pt_br
        fields:
          type: object
          properties:
            name:
              type: string
              description: Name of the user who will receive the code
              example: Josh Doe
      required:
        - configurationId
        - to
        - channel
        - fields
    2fa.token.responses.token-verified:
      type: object
      properties:
        id:
          type: string
          description: Token Id
          example: 7388c68e-675e-435b-b2ec-f72677798678
        from:
          type: string
          description: Contact of origin
          example: email@email.com
        to:
          type: string
          description: Recipient contact
          example: received_email@email.com
        channel:
          type: string
          description: Channel used
          enum:
            - sms
            - email
          example: email
        locale:
          type: string
          description: Location configured
          example: pt_br
        configurationId:
          type: string
          description: Token Configuration Id
          example: 88ff8743-22ba-44db-850b-5f54d6442cdd
        fields:
          type: object
          description: Fields with key words of the text that will be sent to the user
          properties:
            name:
              type: string
              description: Name of the user who will receive the code
              example: Josh Doe
        status:
          type: string
          description: Status of the generated token
          enum:
            - PENDING
            - CANCELED
            - VERIFIED
          example: VERIFIED
        remoteip:
          type: string
          description: Ip of the user making the request to be authenticated
          example: '127.0.0.1:80'
        verify:
          $ref: '#/components/schemas/2fa.configuration.requests.verify'
        delivery:
          $ref: '#/components/schemas/2fa.configuration.requests.delivery'
        expiresAt:
          title: Expiration timestamp
          type: string
          description: Timestamp of the expiration date
          example: '2022-10-27T13:26:11.354Z'
        createdAt:
          title: Creation timestamp
          type: string
          description: Timestamp of token creation.
          example: '2022-10-27T13:25:11.354Z'
        updatedAt:
          title: Update timestamp
          type: string
          description: Timestamp of updates
          example: '2022-10-27T13:25:11.354Z'
    2fa.token.responses.token:
      type: object
      properties:
        id:
          type: string
          description: Token Id
          example: 7388c68e-675e-435b-b2ec-f72677798678
        from:
          type: string
          description: Contact of origin
          example: email@email.com
        to:
          type: string
          description: Recipient contact
          example: received_email@email.com
        channel:
          type: string
          description: Channel used
          enum:
            - sms
            - email
          example: email
        locale:
          type: string
          description: Configured locale
          example: pt_br
        configurationId:
          type: string
          description: Token Configuration Id
          example: 88ff8743-22ba-44db-850b-5f54d6442cdd
        fields:
          type: object
          description: Fields with key words of the text that will be sent to the user
          properties:
            name:
              type: string
              description: Name of the user who will receive the code
              example: Josh Doe
        status:
          type: string
          description: Status of the generated token
          enum:
            - PENDING
            - CANCELED
            - VERIFIED
          example: PENDING
        remoteip:
          type: string
          description: Ip of the user making the request to be authenticated
          example: '127.0.0.1:80'
        verify:
          $ref: '#/components/schemas/2fa.configuration.requests.verify'
        delivery:
          $ref: '#/components/schemas/2fa.configuration.requests.delivery'
        expiresAt:
          title: Expiration timestamp
          type: string
          description: Timestamp of the expiration date
          example: '2022-10-27T13:26:11.354Z'
        createdAt:
          title: Creation timestamp
          type: string
          description: Timestamp of token creation.
          example: '2022-10-27T13:25:11.354Z'
        updatedAt:
          title: Update timestamp
          type: string
          description: Timestamp of updates
          example: '2022-10-27T13:25:11.354Z'
    batches.base:
      title: Batch Object
      description: This is a Batch object model
      type: object
      properties:
        id:
          title: Batch ID
          description: Batch identifier created automatically
          type: string
          example: ad48e792-7d6e-464f-a478-df3239475016
          readOnly: true
        name:
          title: Batch Name
          description: Batch identification name
          type: string
          example: My batch name
        channel:
          title: Channel
          description: Message channel
          type: string
      required:
        - name
        - channel
    batches.multipart-batch:
      title: Batch Object
      description: This is a Batch object model
      oneOf:
        - $ref: '#/components/schemas/batches.multipart.batch.sms'
        - $ref: '#/components/schemas/batches.multipart.batch.whatsapp'
        - $ref: '#/components/schemas/batches.multipart.batch.rcs'
        - $ref: '#/components/schemas/batches.multipart.batch.email'
      discriminator:
        propertyName: channel
        mapping:
          sms: '#/components/schemas/batches.multipart.batch.sms'
          whatsapp: '#/components/schemas/batches.multipart.batch.whatsapp'
          rcs: '#/components/schemas/batches.multipart.batch.rcs'
          email: '#/components/schemas/batches.multipart.batch.email'
    batches.multipart.base:
      title: Batch Object
      description: This is a Batch object model
      type: object
      allOf:
        - $ref: '#/components/schemas/batches.base'
        - type: object
          properties:
            columnMapper:
              $ref: '#/components/schemas/batches.multipart.columnMapper'
            message:
              $ref: '#/components/schemas/batches.multipart.message'
          required:
            - message
            - columnMapper
    batches.multipart.batch.email:
      allOf:
        - $ref: '#/components/schemas/batches.multipart.base'
        - type: object
          properties:
            message:
              type: object
              properties:
                contents:
                  type: array
                  items:
                    anyOf:
                      - $ref: '#/components/schemas/batches.multipart.content.template'
                    discriminator:
                      propertyName: type
                      mapping:
                        template: '#/components/schemas/batches.multipart.content.template'
    batches.multipart.batch.rcs:
      allOf:
        - $ref: '#/components/schemas/batches.multipart.base'
        - type: object
          properties:
            message:
              type: object
              properties:
                contents:
                  type: array
                  items:
                    anyOf:
                      - $ref: '#/components/schemas/batches.multipart.content.text'
                      - $ref: '#/components/schemas/batches.multipart.content.template'
                    discriminator:
                      propertyName: type
                      mapping:
                        template: '#/components/schemas/batches.multipart.content.template'
                        text: '#/components/schemas/batches.multipart.content.text'
    batches.multipart.batch.sms:
      allOf:
        - $ref: '#/components/schemas/batches.multipart.base'
        - type: object
          properties:
            message:
              type: object
              properties:
                contents:
                  type: array
                  items:
                    anyOf:
                      - $ref: '#/components/schemas/batches.multipart.content.text'
                    discriminator:
                      propertyName: type
                      mapping:
                        text: '#/components/schemas/batches.multipart.content.text'
    batches.multipart.batch.whatsapp:
      allOf:
        - $ref: '#/components/schemas/batches.multipart.base'
        - type: object
          properties:
            message:
              type: object
              properties:
                contents:
                  type: array
                  items:
                    anyOf:
                      - $ref: '#/components/schemas/batches.multipart.content.template'
                    discriminator:
                      propertyName: type
                      mapping:
                        template: '#/components/schemas/batches.multipart.content.template'
    batches.multipart.columnMapper:
      title: Column Mapper
      description: The mapping of variables in relation to the columns of the file. This indicates in which column of the file is the value that must be used to fill each variable. The **recipient_header_name** variable is required so the values on it are used as recipient's contact number.
      type: object
      example:
        recipient_header_name: recipient_number_column
        name: recipient_name_column
        protocol: protocol_column
      properties:
        recipient_header_name:
          title: Recipient header name
          description: Recipient header name
          type: string
          example: recipient_header_name
      additionalProperties:
        title: Column Name
        description: Values on the column provided as value will be made available as a variable named after the property name.
        type: string
      required:
        - recipient_header_name
    batches.multipart.message:
      title: Message Object
      description: This is a Message object model
      type: object
      properties:
        from:
          title: Sender ID
          description: The identifier of the sender of the message. The sender shoud be created with a credential.
          type: string
        contents:
          title: Message Contents
          description: A list of content to be sent
          type: array
          minItems: 1
          items:
            type: object
      required:
        - from
        - contents
    batches.multipart.content.template:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.base'
        - type: object
          properties:
            type:
              type: string
              example: template
            templateId:
              type: string
              description: 'The template identifier. Click <a href="https://app.zenvia.com/home/templates" target="_blank">here</a> to go to the template page.'
              example: c2c3e42d-6fb7-4ad6-897a-dd7613469f58
          required:
            - type
            - templateId
    batches.multipart.content.text:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.base'
        - type: object
          properties:
            type:
              type: string
              example: text
            text:
              description: 'Text to be sent to all recipients in the contact file. The text supports the use of variables, for its creation the following pattern must be used: **{{variable}}**'
              type: string
              example: 'Hello {{name}} your service protocol is number {{protocol}}'
          required:
            - type
            - text
    chatbot.chatbot-outbound:
      title: Chatbot Outbound
      description: 'The customer can use this API to send communications to customers and, when the customer interacts, it must follow a specific flow, according to the Chatbot programming.'
      type: object
      required:
        - from
        - to
        - channel
        - contents
      properties:
        id:
          type: number
          description: Outbound message identifier in NLU
          example: 1293
          readOnly: true
        channelId:
          type: number
          description: Channel identifier in NLU
          example: 2
          readOnly: true
        contactId:
          type: number
          description: Contact identifier in NLU
          example: 9752
          readOnly: true
        messageId:
          type: string
          title: Message ID
          description: An ID for the message. It can be used for future message consulting or callback notifications.
          readOnly: true
        status:
          type: string
          description: Status of outbound trigger
          example: pending
          readOnly: true
        createdAt:
          title: Creation Timestamp
          description: Timestamp of the outbound message trigger
          type: string
          example: '2022-10-27T13:25:11.354Z'
          readOnly: true
        from:
          title: From
          description: Identifier of the channel to be triggered.
          type: string
          example: '551130309090'
          minLength: 1
        to:
          title: To
          description: User identifier according to the channel.
          type: string
          example: '44988776655'
          minLength: 1
        channel:
          title: Channel
          description: The channel name to be trigerred.
          type: string
          example: whatsapp
          minLength: 1
        contents:
          title: Contents
          description: Contents of template to trigger outbound.
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/content.template'
            discriminator:
              propertyName: type
              mapping:
                template: '#/components/schemas/content.template'
          minItems: 1
        nodeId:
          title: Node Id
          description: Node identifier in NLU.
          type: string
          example: node_6fb54f855f19a947
        attributes:
          title: Attributes
          description: Attributes of NLU contact to be set.
          type: object
          properties:
            name:
              title: Name
              description: Name
              type: string
              example: John
            email:
              title: Email
              description: Contact's email
              type: string
              example: john@doe.email.com
            cpf:
              title: CPF
              description: Contact's CPF
              type: string
              example: '11122233344'
            birthdate:
              title: Contact's birth date
              description: Contact's birthdate
              type: string
              example: '1970-06-13'
            gender:
              title: Gender
              description: Contact's gender
              type: string
              example: Male
            address:
              title: Address
              description: Contact's address fields
              type: object
              properties:
                postalCode:
                  description: Postal code
                  type: string
                  example: 11222-000
                street:
                  description: Street name
                  type: string
                  example: Street address
                number:
                  description: House number
                  type: number
                  example: 123
                complement:
                  description: House complement
                  type: string
                  example: Store 03
                district:
                  description: District name
                  type: string
                  example: District name
                city:
                  description: City name
                  type: string
                  example: City name
                state:
                  description: State abbreviation
                  type: string
                  example: SP
            extra:
              title: Extra
              description: 'Extra attributes of NLU contact. New properties will be created that do not exist in NLU. Existing properties will have their values replaced. Only properties with letters, digits and/or underscores will be accepted. Any other character will be considered invalid and the property will not be created.'
              type: object
              example:
                new_property: some_value
                identification_number2: ''
        restartContact:
          title: restartContact
          description: Parameter to reset context variables and create a new service in NLU.
          type: boolean
          example: true
        inactivityTime:
          title: inactivityTime
          description: 'Time in minutes that must pass since the user''s last interaction with the assistant for the message to be sent. Example: If the user is interacting or interacted with the assistant 1 minute ago and the inactivity time required for the message to be sent is 2 minutes `"inactivityTime": 2`, the message would not be sent. If the interaction had occurred 3 minutes ago, the message would be sent.'
          type: number
          example: 2
    contacts-management.contact-custom-data-field:
      title: Contact Custom Data Field
      description: Definition of a field which can be provided on a contact data.
      type: object
      properties:
        id:
          title: ID
          description: 'ID of the contact data field to be created. This will be field name to be used on the [contacts API](#tag/Contacts/paths/~1contacts/post).'
          type: string
          example: my_field
          readOnly: true
        name:
          title: Name
          description: 'Friendly name for the field. This is used on user interfaces like [Zenvia Campaign](https://app.zenvia.com/campaign).'
          type: string
          example: My Field
        type:
          title: Type
          description: The type of values stored in this field. It affects validation and rendering in user interfaces.
          type: string
          example: date
          enum:
            - string
            - number
            - date
          default: string
        createdAt:
          title: Created At
          description: Timestamp of the contact data field creation.
          type: string
          example: '2022-05-23T19:37:59.000Z'
          readOnly: true
      required:
        - name
    contacts-management.contact-list:
      title: Contact List
      description: List of contacts.
      type: object
      properties:
        id:
          title: ID
          description: ID of the contact list.
          type: string
          readOnly: true
        name:
          title: Name
          description: Contact list's name.
          type: string
          example: Technology interest
        size:
          title: Size
          description: Number of contacts are in the list.
          type: number
          example: 10
          readOnly: true
        createdAt:
          title: Created At
          description: Timestamp of the contact list creation.
          type: string
          example: '2022-05-23T19:37:59.000Z'
          readOnly: true
        updatedAt:
          title: Updated At
          description: Timestamp of the contact list update.
          type: string
          example: '2022-05-23T19:37:59.000Z'
          readOnly: true
    contacts-management.contact:
      title: Contact
      description: Contact information.
      type: object
      properties:
        id:
          title: ID
          description: ID of the contact.
          type: string
          readOnly: true
        channels:
          title: Channels
          description: Contact communication channels. At least one communication channel must be provided.
          type: object
          minProperties: 1
          properties:
            email:
              title: E-mail
              description: Contact's e-mail address.
              type: string
              example: contact@domain.example
            mobile:
              title: Mobile
              description: Contact's mobile phone number.
              type: string
              pattern: '^[0-9]+$'
              example: '5510888883333'
            landline:
              title: Landline
              description: Contact's landline phone number.
              type: string
              pattern: '^[0-9]+$'
              example: '551044443333'
            facebook:
              title: Facebook
              description: Contact's Facebook ID.
              type: string
              pattern: '^[a-zA-Z0-9._@-]+$'
              example: user.name.123
            instagram:
              title: Instagram
              description: Contact's Instagram ID.
              type: string
              pattern: '^[a-zA-Z0-9._-]+$'
              example: user_name
            twitter:
              title: Twitter
              description: Contact's Twitter handle.
              type: string
              pattern: '^@[a-zA-Z0-9_]{1,15}$'
              example: '@username'
            meli:
              title: Mercado Livre
              description: Contact's Mercado Livre ID.
              type: string
              pattern: '^[a-zA-Z0-9._-]+$'
              example: meliUser_123
        firstName:
          title: First Name
          description: Contact's name.
          type: string
          example: Rafael
        lastName:
          title: Last Name
          description: Contact's surname.
          type: string
          example: Souza
        birthdate:
          title: Birthdate
          description: Contact's birthdate
          type: string
          example: '1970-06-13'
        customData:
          title: Custom Data
          description: 'Set values for contact custom data fields created on [contact data fields API](#tag/Contacts/paths/~1contacts-data-fields/post).'
          type: object
          additionalProperties:
            title: Value
            description: 'Sets a value to a contact custom data field (the property name). Contact custom data fields are global across contacts and must be previously created on [contact data fields API](#tag/Contacts/paths/~1contacts-data-fields/post).<br>Remember that dates are serialized as `string`.'
            oneOf:
              - type: string
                title: String/Date
                example: '2022-06-13'
              - type: number
                title: Number
                example: 10
              - type: boolean
                title: Boolean
                example: true
        addresses:
          title: Addresses
          description: Contact's addresses.
          type: array
          items:
            title: Address
            description: Address object.
            type: object
            properties:
              country:
                title: Country
                description: Address country.
                type: string
                example: Brazil
              zipcode:
                title: Zip Code
                description: Address zip code.
                type: string
                example: 01310-300
              state:
                title: State
                description: Address state or region.
                type: string
                example: SP
              city:
                title: City
                description: Address city.
                type: string
                example: São Paulo
              address:
                title: Address
                description: Street address.
                type: string
                example: Av. Paulista
              streetNumber:
                title: Street Number
                description: Street number.
                type: string
                example: '2300'
              neighborhood:
                title: Neighborhood
                description: Address neighborhood or address line 3.
                type: string
                example: Bela Vista
        listIds:
          title: List IDs
          description: IDs of the lists the contact is included in.
          type: array
          items:
            type: string
          example:
            - list-id-01
            - list-id-02
            - list-id-03
        createdAt:
          title: Created At
          description: Timestamp of the contact creation.
          type: string
          example: '2022-05-23T19:37:59.000Z'
          readOnly: true
        updatedAt:
          title: Updated At
          description: Timestamp of the contact update.
          type: string
          example: '2022-05-23T19:37:59.000Z'
          readOnly: true
    content.all:
      anyOf:
        - $ref: '#/components/schemas/content.whatsapp.all'
        - $ref: '#/components/schemas/content.instagram.all'
        - $ref: '#/components/schemas/content.sms.all'
        - $ref: '#/components/schemas/content.facebook.all'
        - $ref: '#/components/schemas/content.rcs.all'
        - $ref: '#/components/schemas/content.voice.all'
        - $ref: '#/components/schemas/content.telegram.all'
        - $ref: '#/components/schemas/content.gbm.all'
        - $ref: '#/components/schemas/content.email.all'
    content.base:
      type: object
      properties:
        type:
          title: Content type
          description: Content type discriminator
          type: string
      required:
        - type
    content.call:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.base'
        - type: object
          properties:
            type:
              type: string
              example: call
            audio:
              description: A sequence of audio bits forming a message to be played at the beginning of the call
              type: array
              items:
                $ref: '#/components/schemas/content.audio-sources.all'
            transferTo:
              description: Transfer or call to another number when the audio message has been completely played
              type: string
              example: '5510999999999'
            recordAudio:
              description: Record the call
              type: boolean
              example: true
            hangUpOnVoiceMail:
              description: End the call on voicemail
              type: boolean
              example: true
          required:
            - type
    content.card:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.base'
        - $ref: '#/components/schemas/content.bases.card-base'
        - type: object
          properties:
            type:
              type: string
              example: card
            media:
              type: object
              allOf:
                - $ref: '#/components/schemas/content.bases.card-media-base'
                - type: object
                  properties:
                    disposition:
                      type: string
                      description: |-
                        Defines the position that the media will be shown inside the card. Some of the values influence the media height.
                                        <br><br>*Only applicable to [RCS](#tag/RCS) and [Google Business Messages](#tag/Google-Business-Messages) channels.*
                                        <br>*`ON_THE_LEFT` and `ON_THE_RIGHT` are only supported by [RCS](#tag/RCS) channel.*
                      enum:
                        - ON_THE_LEFT
                        - ON_THE_RIGHT
                        - ON_THE_TOP_SHORT_HEIGHT
                        - ON_THE_TOP_MEDIUM_HEIGHT
                        - ON_THE_TOP_TALL_HEIGHT
                      default: ON_THE_TOP_SHORT_HEIGHT
            quickReplyButtons:
              $ref: '#/components/schemas/content.bases.quick-reply-list'
    content.carousel:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.base'
        - type: object
          properties:
            type:
              type: string
              example: carousel
            cardWidth:
              type: string
              description: |-
                The card width, which is always smaller than the width of the standalone card. The standard card width would be the equivalent of `LARGE` if it were available for use for the cards of the carousel.
                          <br><br>*Only applicable to [RCS](#tag/RCS) and [Google Business Messages](#tag/Google-Business-Messages) channels.*
              enum:
                - SMALL
                - MEDIUM
              default: MEDIUM
            cards:
              title: Card
              description: The sequence of cards to be shown in the carousel.
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: object
                allOf:
                  - $ref: '#/components/schemas/content.bases.card-base'
                  - type: object
                    properties:
                      media:
                        type: object
                        allOf:
                          - $ref: '#/components/schemas/content.bases.card-media-base'
                          - type: object
                            properties:
                              disposition:
                                type: string
                                description: |-
                                  Defines the position that the media will be shown inside the card. The values influence the media height.
                                                          <br><br>*Only applicable to [RCS](#tag/RCS) and [Google Business Messages](#tag/Google-Business-Messages) channels.*
                                enum:
                                  - ON_THE_TOP_SHORT_HEIGHT
                                  - ON_THE_TOP_MEDIUM_HEIGHT
                                  - ON_THE_TOP_TALL_HEIGHT
            quickReplyButtons:
              $ref: '#/components/schemas/content.bases.quick-reply-list'
          required:
            - type
            - cards
    content.contacts:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.base'
        - type: object
          properties:
            type:
              type: string
              example: contacts
            contacts:
              description: A list of contacts
              type: array
              items:
                type: object
                properties:
                  addresses:
                    description: A list of contact addresses
                    type: array
                    items:
                      type: object
                      properties:
                        street:
                          description: Street number and name
                          type: string
                          example: 'Street Address, 123'
                        city:
                          description: City name
                          type: string
                          example: City name
                        state:
                          description: State abbreviation
                          type: string
                          example: SP
                        zip:
                          description: ZIP code
                          type: string
                          example: 01000-000
                        country:
                          description: Full country name
                          type: string
                          example: Brazil
                        countryCode:
                          description: Two-letter country abbreviation
                          type: string
                          example: BR
                        type:
                          description: The type of the address
                          type: string
                          enum:
                            - HOME
                            - WORK
                          example: WORK
                    minItems: 0
                  birthday:
                    description: The birthday of the contact
                    type: string
                    example: 11/10/1980
                  contactImage:
                    description: Base64-encoded image. Its value has to be a string based on the Base64 Data Encodings specification (RFC 4648).
                    type: string
                  emails:
                    description: A list of e-mails
                    type: array
                    items:
                      type: object
                      properties:
                        email:
                          description: E-mail address
                          type: string
                          example: my-email@email-domain.com
                        type:
                          description: The type of e-mail
                          type: string
                          enum:
                            - HOME
                            - WORK
                          example: HOME
                    minItems: 0
                  ims:
                    description: A list of messaging contact information
                    type: array
                    items:
                      type: object
                      properties:
                        service:
                          description: Instant messaging service name
                          type: string
                          example: This is a messaging service
                        userId:
                          description: User identifier in this instant messaging service
                          type: string
                          example: johnsmith
                    minItems: 0
                  name:
                    description: Full contact name
                    type: object
                    properties:
                      formattedName:
                        description: Full name as it normally appears
                        type: string
                        example: John Megan Smith
                      firstName:
                        description: First name
                        type: string
                        example: John
                      lastName:
                        description: Last name
                        type: string
                        example: Smith
                      middleName:
                        description: Middle name
                        type: string
                        example: Megan
                      suffix:
                        description: Name suffix
                        type: string
                        example: PhD
                      prefix:
                        description: Name preffix
                        type: string
                        example: Mr.
                    required:
                      - formattedName
                      - firstName
                  org:
                    title: Organization
                    description: Contact organization information
                    type: object
                    properties:
                      company:
                        description: Name of the contact's company
                        type: string
                        example: Ms. Sara
                      department:
                        description: Name of the contact's department
                        type: string
                        example: Sales
                      title:
                        description: Contact's business title
                        type: string
                        example: Manager
                  phones:
                    description: A list of contact phone numbers
                    type: array
                    items:
                      type: object
                      properties:
                        phone:
                          description: Formatted phone number
                          type: string
                          example: '+5521999998888'
                        type:
                          description: The type of the phone number
                          type: string
                          enum:
                            - CELL
                            - MAIN
                            - IPHONE
                            - HOME
                            - WORK
                          example: CELL
                        waId:
                          description: 'WhatsApp ID _(supported channels: WhatsApp)_'
                          type: string
                    minItems: 0
                  urls:
                    description: A list of contact URLs
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          description: URL
                          type: string
                          example: 'https://www.zenvia.com'
                        type:
                          description: The type of the phone number
                          type: string
                          enum:
                            - HOME
                            - WORK
                          example: WORK
                    minItems: 0
                required:
                  - name
              minItems: 1
          required:
            - type
            - contacts
    content.conversation:
      title: Conversation Content
      type: object
      allOf:
        - type: object
          properties:
            solution:
              title: Solution Name
              type: string
              description: 'If the contact replies to the API message, the conversation will be redirected to the chosen solution.'
              enum:
                - conversion
                - zenvia_chat
                - nlu
            properties:
              title: Properties
              type: object
              description: 'If the contact replies to the API message, these properties will be available for querying in the chosen solution.'
          required:
            - solution
    content.email:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.base'
        - type: object
          properties:
            type:
              type: string
              example: email
            subject:
              type: string
              description: The e-mail subject
              example: 'Re: Ticket 12345'
              minLength: 1
            html:
              type: string
              maxLength: 32768
              description: |-
                The e-mail content in HTML format.
                                      <br>Inline attachment *is supported*. The *cid* of the content is the *fileName*.
                                      <br>Ex: `<img src="cid:example2.jpeg">`.
              example: '<b>Hi!</b><br><img src="cid:example2.jpeg">'
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/content.bases.file'
              description: E-mail attachments.
              example:
                - fileUrl: 'https://zenvia.com/example1.pdf'
                - fileUrl: 'https://zenvia.com/example2.jpg'
                  fileName: example2.jpeg
            cc:
              type: array
              items:
                $ref: '#/components/schemas/content.email.recipient'
              title: Courtesy Copy
              description: List of e-mails addresses to be copied on the e-mail.
              example:
                - email: cc1@zenvia.com
                - email: cc2@zenvia.com
                  name: CC2
            bcc:
              type: array
              items:
                $ref: '#/components/schemas/content.email.recipient'
              title: Blind Courtesy Copy
              description: List of e-mails addresses to be secretly copied on the e-mail.
              example:
                - email: bcc1@zenvia.com
                - email: bcc2@zenvia.com
                  name: BCC2
            replyTo:
              allOf:
                - $ref: '#/components/schemas/content.email.reply-to'
          required:
            - type
            - subject
            - html
    content.file:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.base'
        - type: object
          properties:
            type:
              type: string
              example: file
          required:
            - type
            - fileUrl
        - $ref: '#/components/schemas/content.bases.file'
        - properties:
            fileCaption:
              type: string
              description: |-
                Some description for the file.
                                      <br>*Only applicable to [WhatsApp](#tag/WhatsApp), [RCS](#tag/RCS), [Telegram](#tag/Telegram) and [Google Business Messages](#tag/Google-Business-Messages) images and videos.*
              example: Some caption
    content.json:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.base'
        - type: object
          properties:
            type:
              type: string
              example: json
            payload:
              type: object
          required:
            - type
            - payload
    content.location:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.base'
        - type: object
          properties:
            type:
              type: string
              example: location
            longitude:
              type: number
              description: Longitude of the location
              example: -122.425332
            latitude:
              type: number
              description: Latitude of the location
              example: 37.758056
            name:
              type: string
              description: Name of the location
              example: Home
            address:
              type: string
              description: Address of the location. Only displayed if name is present.
              example: Home Address
            url:
              type: string
              description: 'URL for the website where the location information was downloaded _(WhatsApp restriction: available only on IN direction)_'
              example: 'https://www.zenvia.com'
          required:
            - type
            - longitude
            - latitude
    content.optin_request:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.base'
        - type: object
          properties:
            type:
              type: string
              example: optin_request
            mediaUrl:
              description: URL of an image to be displayed inside the opt-in request.
              type: string
              example: 'https://cdn.zenvia.com/main-picture.jpg'
            title:
              description: The topic of the recurring messages subscription. This will be displayed in the opt-in request.<br>You can send up to 10 opt-in requests for **different** titles per user over a 7 days period. A sub-limit of up to 5 opt-in requests may be sent to a contact in a day.
              type: string
              example: Weekly Sale
            frequency:
              description: How often the messages will be sent after the contact opted-in.
              type: string
              enum:
                - DAILY
                - WEEKLY
                - MONTHLY
            reOptIn:
              description: Allow the contact to opt-in back again after opting-out.
              type: string
              enum:
                - ENABLED
                - DISABLED
              default: ENABLED
            payload:
              description: 'Content to be sent back as an [opt-in response](#section/OptIn-Response) message event when the contact accepts to receive recurring messages.<br>By default, the `title` of the request will be used as payload.'
              type: string
            timezone:
              description: Indicates the timezone that will be used for scheduling the recurring messages.<br>
              example: America/Sao_Paulo
              default: UTC
              type: string
          required:
            - title
            - frequency
    content.optin_response:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.base'
        - type: object
          properties:
            type:
              type: string
              example: optin_response
            recurringMessagesRecipient:
              type: string
              description: 'The contact id that needs to be used to send the recurring messages for the topic the user has opted-in. You will receive a unique contact id for each topic the user opts-in. Therefore, this needs to be used the recipient (`to` attribute) when sending a recurring message. This contact id has an expiration timestamp.'
            optInExpiration:
              type: string
              description: 'The timestamp when the opt-in will expire and no longer be usable, unless renewed.<br>Just before this expiration, the user will have the option to renew this topic opt-in. When the user makes a choice, a new [webhook](#section/MESSAGE) with a new [OptIn Response](#section/OptIn-Response) will be sent.'
            optInStatus:
              title: OptIn Status
              description: 'Indicates whether this is a new opt-in, an opt-out, or a reopt-in.'
              type: string
              example: OPTIN
              enum:
                - OPTIN
                - OPTOUT
                - REOPTIN
            frequency:
              type: string
              description: How often the recurring messages may be sent.
              example: DAILY
              enum:
                - DAILY
                - WEEKLY
                - MONTHLY
            payload:
              type: string
              description: 'The payload set in the [opt-in request](#section/OptIn-Request) message of this opt-in response.'
    content.replyable-text:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.text'
        - type: object
          properties:
            type:
              type: string
              example: replyable_text
            quickReplyButtons:
              $ref: '#/components/schemas/content.bases.quick-reply-list'
    content.template:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.base'
        - type: object
          properties:
            type:
              type: string
              example: template
            templateId:
              type: string
              description: 'The template identifier. Click <a href="https://app.zenvia.com/home/templates" target="_blank">here</a> to go to the template page.'
              example: c2c3e42d-6fb7-4ad6-897a-dd7613469f58
            fields:
              type: object
              description: 'The available fields to be used in this template.<br><br>        For media templates, the media URL is obtained from `imageUrl`, `videoUrl` or `documentUrl` depending on the template used.<br><br>        For WhatsApp authentication templates, pass the `token` parameter and its value. It is required.<br><br>        For WhatsApp coupon templates, pass the `code` parameter and its value. It is required.'
              example:
                user: John Smith
                protocol: '34534252'
              oneOf:
                - title: Default
                  type: object
                  additionalProperties:
                    description: Value provided to fill the variable named after the property name.
                    oneOf:
                      - type: string
                        example: Zenvia
                      - type: number
                        example: 1
                      - type: boolean
                        example: true
                - title: Cards
                  type: object
                  required:
                    - cards
                  properties:
                    cards:
                      type: array
                      description: |-
                        The properties of the cards in a template.
                        In cards with a predefined order, each card will be rendered following its order at the time of the creation of the template.

                         Only applicable to [WhatsApp](#tag/WhatsApp) channel.
                      minItems: 2
                      maxItems: 10
                      items:
                        type: object
                        anyOf:
                          - title: Cards with dynamic ordering and image as background
                            required:
                              - orderPosition
                              - imageUrl
                            properties:
                              orderPosition:
                                description: 'Defines the final position of the card in the outcome. The array index indicates which card is being referenced, and the value of `orderPosition` determines its final position.'
                                type: number
                              imageUrl:
                                type: string
                                description: URL of the image
                            additionalProperties:
                              description: Value provided to fill the variable named after the property name.
                              oneOf:
                                - type: string
                                  example: Zenvia
                                - type: number
                                  example: 1
                                - type: boolean
                                  example: true
                          - title: Cards with dynamic ordering and video as background
                            required:
                              - orderPosition
                              - videoUrl
                            properties:
                              orderPosition:
                                description: 'Defines the final position of the card in the outcome. The array index indicates which card is being referenced, and the value of `orderPosition` determines its final position.'
                                type: number
                              videoUrl:
                                type: string
                                description: URL of the video
                            additionalProperties:
                              description: Value provided to fill the variable named after the property name.
                              oneOf:
                                - type: string
                                  example: Zenvia
                                - type: number
                                  example: 1
                                - type: boolean
                                  example: true
                          - title: Cards with predefined order and image as background
                            required:
                              - imageUrl
                            properties:
                              imageUrl:
                                type: string
                                description: URL of the image
                            additionalProperties:
                              description: Value provided to fill the variable named after the property name.
                              oneOf:
                                - type: string
                                  example: Zenvia
                                - type: number
                                  example: 1
                                - type: boolean
                                  example: true
                          - title: Cards with predefined order and video as background
                            required:
                              - videoUrl
                            properties:
                              videoUrl:
                                type: string
                                description: URL of the video
                            additionalProperties:
                              description: Value provided to fill the variable named after the property name.
                              oneOf:
                                - type: string
                                  example: Zenvia
                                - type: number
                                  example: 1
                                - type: boolean
                                  example: true
                - $ref: '#/components/schemas/content.whatsapp.order-details-template'
                  x-unpublished: true
                - title: Product Sections
                  required:
                    - sections
                  type: object
                  properties:
                    sections:
                      $ref: '#/components/schemas/content.whatsapp.product-sections'
                  additionalProperties:
                    description: Value provided to fill the variable named after the property name.
                    oneOf:
                      - type: string
                        example: Zenvia
                      - type: number
                        example: 1
                      - type: boolean
                        example: true
          required:
            - type
            - templateId
    content.text:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.base'
        - type: object
          properties:
            type:
              type: string
              example: text
            text:
              description: |-
                Text to be sent. When a URL is sent in the text, a URL preview will be added to the message, if the channel supports it.
                          <br>*URL preview only applicable to [WhatsApp](#tag/WhatsApp) channel.*
              type: string
              example: This is a text.
              minLength: 1
            payload:
              description: Payload of selected button
              type: string
              readOnly: true
            category:
              type: string
              enum:
                - UTILITY
              description: The category used to identify Direct Send messages
              x-unpublished: true
          required:
            - type
            - text
    content.audio-sources.all:
      oneOf:
        - $ref: '#/components/schemas/content.audio-sources.tts'
        - $ref: '#/components/schemas/content.audio-sources.file'
      discriminator:
        propertyName: type
        mapping:
          tts: '#/components/schemas/content.audio-sources.tts'
          file: '#/components/schemas/content.audio-sources.file'
    content.audio-sources.file:
      title: Audio file
      description: URL of audio
      type: object
      properties:
        type:
          type: string
        fileUrl:
          description: URL of audio
          type: string
          example: 'http://fooooo.bar/audio.mp3'
          minLength: 1
      required:
        - type
        - fileUrl
    content.audio-sources.tts:
      title: Text to speech
      description: Send a text to speech
      type: object
      properties:
        type:
          type: string
        text:
          description: Text that will be read on the call with the chosen voice type
          type: string
          example: This is a text
        voiceStyle:
          type: string
          description: Language and type of the audio message
          enum:
            - br-Camila
            - br-Vitoria
            - br-Ricardo
            - en-Joey
            - en-Joanna
            - fre-Celine
            - fre-Mathieu
            - ger-Vicki
            - ger-Hans
            - ita-Carla
            - ita-Giorgio
            - jap-Mizuki
            - pol-Jan
            - rus-Tatyana
            - rus-Maxim
            - esp-Conchita
            - esp-Enrique
          default: br-Vitoria
          example: br-Ricardo
        awaitRecipientAnswer:
          description: Await for the recipient answer
          type: boolean
          example: true
      required:
        - type
        - text
    content.bases.buttons-list:
      type: array
      title: Buttons
      description: |-
        Vertical list of buttons displayed inside a card. These will *not* fade away once a button is clicked.<br>
            <br>*[RCS](#tag/RCS): A maximum of 4 buttons is supported, but they might not be shown if they do not fit in the available space.*
            <br>*[Google Business Messages](#tag/Google-Business-Messages): A maximum of 4 buttons is supported. Supported types: `text`, `link` and `dial`.*
            <br>*[Instagram](#tag/Instagram): A maximum of 3 buttons is supported. Supported types: `text` and `link`.*
            <br>*[Facebook](#tag/Facebook): A maximum of 3 buttons is supported. Supported types: `text`, `link` and `dial`.*
            <br>*[Telegram](#tag/Telegram): Supported types: `link`.*
      maxItems: 4
      items:
        $ref: '#/components/schemas/content.bases.buttons.all'
    content.bases.card-base:
      type: object
      properties:
        title:
          type: string
          description: |-
            A title in bold shown above the text of the card.
                    <br>*[Instagram](#tag/Instagram): A maximum of 80 characters is supported.*
          example: Hello
        text:
          type: string
          description: |-
            A text to be displayed inside the card.
                    <br>*[Instagram](#tag/Instagram): A maximum of 80 characters is supported.*
          example: This is the best thing you will see today!
        media:
          type: object
        buttons:
          $ref: '#/components/schemas/content.bases.buttons-list'
    content.bases.card-media-base:
      type: object
      title: Media
      description: An image or a video to be displayed inside the card.
      properties:
        url:
          type: string
          description: |-
            Public URL of media file, which can be an image, a GIF, or a video. The media will be displayed inside the card.
                    <br><br>*Videos usually will display a play button instead of a preview of the content sent.*
                    <br>*Some channels do not support videos or GIFs.*
          example: 'https://zenvia.com/zenvia-team.png'
        disposition:
          type: string
          default: ON_THE_TOP_SHORT_HEIGHT
        caption:
          type: string
          description: |-
            Media content description used by screen readers to aid users with disability understand the context.
                    <br><br>*Only applicable to [RCS](#tag/RCS) and [Google Business Messages](#tag/Google-Business-Messages) channels.*
          example: Zenvia's team picture
      required:
        - url
    content.bases.file:
      type: object
      title: File
      properties:
        fileUrl:
          type: string
          description: URL of the file to be sent. The image at this URL should be publicly accessible and downloadable.
          example: 'https://zenvia.com/document.pdf'
        thumbnailUrl:
          type: string
          description: |-
            Image URL to be used as a thumbnail for **media** files. Accepted formats are PNG, JPEG and GIF. The image at this URL should be publicly accessible and downloadable..
                                  <br> Only applicable to *[RCS](#tag/RCS)*
          example: 'https://storage.com/image.png'
        thumbnailMimeType:
          type: string
          description: |-
            MIME type of the file to be sent. If not sent, the MIME type will be identified using the content type sent in the request header.<br>
                                  <br> Only applicable to *[RCS](#tag/RCS)*
          example: image/png
        fileMimeType:
          type: string
          description: |-
            MIME type of the file to be sent. If not sent, the MIME type will be identified using the content type sent in the request header.<br>
                                <br>*[WhatsApp](#tag/WhatsApp): see [supported contents and sizes.](#section/WhatsApp-limitations)*
                                <br>*[Instagram](#tag/Instagram): see [supported contents and sizes.](#section/Instagram-limitations)*
                                <br>*[Telegram](#tag/Telegram): see [supported contents and sizes.](#section/Telegram-limitations)*
                                <br>*[E-Mail](#tag/E-Mail): see [supported contents and sizes.](#section/E-Mail-limitations)*
                                <br>*For the rest of the channels, the limitations are currently undocumented.*
          example: application/pdf
        fileName:
          type: string
          description: |-
            The name of the file.
                                <br>*Only applicable to [WhatsApp](#tag/WhatsApp), [Facebook](#tag/Facebook), [Telegram](#tag/Telegram), [Google Business Messages](#tag/Google-Business-Messages) and [E-mail](#tag/E-Mail) documents.*
          example: document.pdf
        status:
          type: string
          description: |-
            The completion state of the file upload.
                                <br>*This property is read-only. It is only included in incoming webhooks that contain file content*
          enum:
            - ACCEPTED
            - REJECTED
        reason:
          type: string
          description: |-
            A concise code for the failure reason.
                                <br>*This property is read-only. It is only included in incoming webhooks that contain file content*
          enum:
            - MIME_TYPE_NOT_SUPPORTED
            - INTERNAL_ERROR
            - SECURITY_CHECK
            - SIZE_LIMIT
      required:
        - fileUrl
    content.bases.quick-reply-list:
      type: array
      title: Quick reply buttons
      description: |-
        Horizontal list of buttons displayed after the content. These *will* fade away once one is clicked.<br>
            <br>*[RCS](#tag/RCS): A maximum of 11 buttons is supported.*
            <br>*[Google Business Messages](#tag/Google-Business-Messages): Supported types: `text`, `link` and `dial`. A maximum of 25 characters is supported in each button.*
            <br>*[Instagram](#tag/Instagram): Supported type: `text`. A maximum of 20 characters is supported in each button.*
            <br>*[Facebook](#tag/Facebook): Supported type: `text`.*
            <br>*[Telegram](#tag/Telegram): Supported types: `text` and `share_location`.*
            <br><br>*Only applicable to [RCS](#tag/RCS) and [Google Business Messages](#tag/Google-Business-Messages) channels for [Cards](#section/Card) and [Carousels](#section/Carousel).*
      maxItems: 13
      items:
        $ref: '#/components/schemas/content.bases.buttons.all'
    content.bases.buttons.all:
      oneOf:
        - $ref: '#/components/schemas/content.bases.buttons.postback'
        - $ref: '#/components/schemas/content.bases.buttons.web-url'
        - $ref: '#/components/schemas/content.bases.buttons.calendar-event'
        - $ref: '#/components/schemas/content.bases.buttons.dial'
        - $ref: '#/components/schemas/content.bases.buttons.share-location'
        - $ref: '#/components/schemas/content.bases.buttons.view-location'
        - $ref: '#/components/schemas/content.bases.buttons.search-location'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/content.bases.buttons.postback'
          link: '#/components/schemas/content.bases.buttons.web-url'
          calendar_event: '#/components/schemas/content.bases.buttons.calendar-event'
          dial: '#/components/schemas/content.bases.buttons.dial'
          share_location: '#/components/schemas/content.bases.buttons.share-location'
          view_location: '#/components/schemas/content.bases.buttons.view-location'
          search_location: '#/components/schemas/content.bases.buttons.search-location'
    content.bases.buttons.base:
      type: object
      properties:
        type:
          title: Button type
          description: Button type discriminator.
          type: string
        text:
          type: string
          description: 'Text to be displayed inside the button.<br><br>*[RCS](#tag/RCS): Maximum of 25 characters.*'
          example: Click me!
        payload:
          type: string
          description: |-
            Content to be sent back as a message or a status event when the user clicks the button.
                    <br>By default, the text of the button will be used as payload.
                    <br><br>*Only applicable to `text` buttons on most channels, because there is no click feedback for the other button types.
                    Applicable to all button types on [RCS](#tag/RCS) and [Google Business Messages](#tag/Google-Business-Messages) channels.*
                    <br>*`text` buttons clicks are sent back as [message events](#section/MESSAGE), while clicks from the other button types are sent back as [status events](#section/MESSAGE_STATUS).*
          example: clicked-on-button-1
    content.bases.buttons.calendar-event:
      type: object
      description: Opens the standard calendar application on the user's device and creates a new event with the sent data.
      allOf:
        - $ref: '#/components/schemas/content.bases.buttons.base'
        - type: object
          properties:
            startTime:
              type: string
              description: Start date and time of the event formatted following RFC3339 standard (similar to ISO 8601). Default timezone is UTC.
              example: '2021-01-15T17:30:00-03:00'
            endTime:
              type: string
              description: End date and time of the event formatted following RFC3339 standard (similar to ISO 8601). Default timezone is UTC.
              example: '2021-01-15T17:30:00-03:00'
            title:
              type: string
              description: Event description.
              example: API development
          required:
            - type
            - text
            - startTime
            - endTime
            - title
    content.bases.buttons.dial:
      type: object
      description: It opens the default dial app on the user's device.
      allOf:
        - $ref: '#/components/schemas/content.bases.buttons.base'
        - type: object
          properties:
            phoneNumber:
              type: string
              description: Phone Number (E.164 format).
              example: '+558006464777'
          required:
            - type
            - text
            - phoneNumber
    content.bases.buttons.postback:
      type: object
      description: Send back a text message event when the user clicks on the button.
      allOf:
        - $ref: '#/components/schemas/content.bases.buttons.base'
        - type: object
          required:
            - type
            - text
    content.bases.buttons.search-location:
      type: object
      description: Opens the standard calendar application on the user's device and creates a new event with the sent data.
      allOf:
        - $ref: '#/components/schemas/content.bases.buttons.base'
        - type: object
          properties:
            query:
              type: string
              description: 'A text, for example, an address or a company name, to be searched in the default user''s map application.'
              example: 'Av. Paulista, 2300 - São Paulo'
          required:
            - type
            - text
            - query
    content.bases.buttons.share-location:
      type: object
      description: Opens the default app for maps on the user's device and requests the user's location.
      allOf:
        - $ref: '#/components/schemas/content.bases.buttons.base'
        - type: object
          required:
            - type
            - text
    content.bases.buttons.view-location:
      type: object
      description: Opens the standard calendar application on the user's device and creates a new event with the sent data.
      allOf:
        - $ref: '#/components/schemas/content.bases.buttons.base'
        - type: object
          properties:
            latitude:
              type: string
              description: Latitude in degrees (range from -90.0 and +90.0).
              example: '-23.557260'
            longitude:
              type: string
              description: Longitude in degrees (range from -180.0 and +180.0).
              example: '-46.661030'
            label:
              type: string
              description: Text to be displayed with the map position pin icon.
              example: Zenvia
          required:
            - type
            - text
            - latitude
            - longitude
    content.bases.buttons.web-url:
      type: object
      description: Opens a URL on user's device and sends the payload field content to the Agent.
      allOf:
        - $ref: '#/components/schemas/content.bases.buttons.base'
        - type: object
          properties:
            url:
              type: string
              description: URL to be accessed upon click.
              example: 'https://zenvia.com/'
          required:
            - type
            - text
            - url
    content.email.all:
      title: E-Mail
      oneOf:
        - $ref: '#/components/schemas/content.email'
        - $ref: '#/components/schemas/content.template'
      discriminator:
        propertyName: type
        mapping:
          email: '#/components/schemas/content.email'
          template: '#/components/schemas/content.template'
    content.email.recipient:
      type: object
