servers:
  - url: 'https://api.zenvia.com/v2'
paths:
  /2fa-configurations:
    post:
      description: Create a configuration
      tags:
        - Two Factor Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/2fa.configuration.requests.all'
      responses:
        '201':
          description: Returns the created configuration
          headers:
            Location:
              description: 'Resource created: https://api.zenvia.com/v2/2fa-configurations/{configurationId}'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/2fa.configuration.responses.token-created'
        default:
          $ref: '#/components/responses/error'
    get:
      description: List all configurations
      tags:
        - Two Factor Authentication
      parameters:
        - $ref: '#/components/parameters/page-legacy'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Return all token configurations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/2fa.configuration.responses.base'
        default:
          $ref: '#/components/responses/error'
  '/2fa-configurations/{configurationId}':
    get:
      description: List a configuration by id
      tags:
        - Two Factor Authentication
      responses:
        '200':
          description: Return the specific configuration by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/2fa.configuration.requests.all'
        default:
          $ref: '#/components/responses/error'
    delete:
      description: Delete a configuration by configuration id
      tags:
        - Two Factor Authentication
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/error'
    patch:
      description: Patch configuration
      tags:
        - Two Factor Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/2fa.configuration.requests.patch-config'
      responses:
        '200':
          description: Returns success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/2fa.configuration.responses.token-created'
        default:
          $ref: '#/components/responses/error'
    parameters:
      - $ref: '#/components/parameters/configurationId'
  '/2fa-configurations/{configurationId}/actions/website-key-recreate':
    post:
      description: Recreate websitekey
      tags:
        - Two Factor Authentication
      responses:
        '200':
          description: Returns success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/2fa.configuration.responses.websitekey-recreated'
        default:
          $ref: '#/components/responses/error'
    parameters:
      - $ref: '#/components/parameters/configurationId'
  /2fa-tokens:
    post:
      description: Send token
      tags:
        - Two Factor Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/2fa.token.requests.token'
      responses:
        '200':
          description: Returns Information about the configuration status after sending a code to the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/2fa.token.responses.token'
        default:
          $ref: '#/components/responses/error'
  /2fa-tokens/actions/resend:
    post:
      description: Resend token
      tags:
        - Two Factor Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/2fa.token.requests.to-channel'
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/error'
  /2fa-tokens/actions/verify:
    post:
      description: Verify token
      tags:
        - Two Factor Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/2fa.token.requests.recipient'
      responses:
        '200':
          description: Returns information about the configuration status after verifying a code sent by the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/2fa.token.responses.token-verified'
        default:
          $ref: '#/components/responses/error'
  '/2fa-tokens/{tokenId}/actions/resend':
    post:
      description: Resend the token by token id
      tags:
        - Two Factor Authentication
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/error'
    parameters:
      - $ref: '#/components/parameters/tokenId'
  '/2fa-tokens/{tokenId}/actions/verify':
    post:
      description: Verify a token by token id
      tags:
        - Two Factor Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/2fa.token.requests.code'
      responses:
        '200':
          description: Returns information about the configuration status after verifying a code sent by the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/2fa.token.responses.token-verified'
        default:
          $ref: '#/components/responses/error'
    parameters:
      - $ref: '#/components/parameters/tokenId'
  /message-batches:
    post:
      description: Create batch
      tags:
        - Message Batches
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                contacts:
                  type: string
                  title: Binary CSV File
                  description: Binary csv file with recipients and variable values when necessary.
                batch:
                  $ref: '#/components/schemas/batches.multipart-batch'
              required:
                - contacts
                - batch
      responses:
        '200':
          description: Created batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/batches.multipart-batch'
        default:
          $ref: '#/components/responses/error'
      x-code-samples:
        - lang: Shell
          label: Bash
          source: |
            curl "https://api.zenvia.com/v2/message-batches" \
            -H "X-API-TOKEN: YOUR_API_TOKEN" \
            -F 'batch={
              "name": "My batch name",
              "channel": "sms",
              "columnMapper": {
                "recipient_header_name": "recipient_number_column",
                "name": "recipient_name_column",
                "protocol": "protocol_column"
              },
              "message": {
                "from": "string",
                "contents": [{
                  "type": "text",
                  "text": "Hello {{name}} your service protocol is number {{protocol}}"
                }]
              }
            };type=application/json' \
            -F 'contacts=@./contacts.csv;type=text/csv;filename=contacts.csv'
  /channels/email/messages:
    post:
      description: Send a E-Mail message
      tags:
        - E-Mail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/message.email'
            examples:
              email:
                value:
                  from: sac@brand.domain
                  to: user@zenvia.com
                  contents:
                    - type: email
                      subject: 'Re: Ticket 12345'
                      html: '<b>Hi!</b><br><img src="cid:example2.jpeg">'
                      attachments:
                        - fileUrl: 'https://zenvia.com/example1.pdf'
                        - fileUrl: 'https://zenvia.com/example2.jpg'
                          fileName: example2.jpeg
                      cc:
                        - email: cc1@zenvia.com
                        - email: cc2@zenvia.com
                          name: CC2
                      bcc:
                        - email: bcc1@zenvia.com
                        - email: bcc2@zenvia.com
                          name: BCC2
                      replyTo:
                        email: reply-to@zenvia.com
                        name: Service Care
                  representative:
                    name: Sender Name
              template:
                value:
                  from: sac@brand.domain
                  to: user@zenvia.com
                  contents:
                    - type: template
                      templateId: template_id
                      fields:
                        name: Jhon
                        product: Zenvia Chat
                  representative:
                    name: Sender Name
      responses:
        '200':
          description: Created message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/message.email'
        default:
          $ref: '#/components/responses/error'
  /channels/facebook/messages:
    post:
      description: Send a Facebook message
      tags:
        - Facebook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/message.facebook'
            examples:
              text:
                value:
                  externalId: my-campaign-name
                  from: fb-page-id
                  to: fb-contact-id
                  contents:
                    - type: text
                      text: Hi Zenvia!
              file:
                value:
                  from: fb-page-id
                  to: fb-contact-id
                  contents:
                    - type: file
                      fileUrl: 'https://zenvia.com/zenvia-team.png'
                      fileMimeType: image/png
                      fileCaption: 'Our pic :)'
                      fileName: team.png
              template:
                value:
                  from: fb-page-id
                  to: fb-contact-id
                  contents:
                    - type: template
                      templateId: template_id
                      fields:
                        name: Jhon
                        product: Zenvia Chat
              card:
                value:
                  from: fb-page-id
                  to: fb-contact-id
                  contents:
                    - type: card
                      title: Card from Zenvia
                      text: This is our products
                      media:
                        url: 'https://zenvia.com/zenvia-office.png'
                        disposition: ON_THE_TOP_MEDIUM_HEIGHT
                        caption: Our amazing office!
                      buttons:
                        - type: link
                          text: Site
                          url: 'https://www.zenvia.com/'
                      quickReplyButtons:
                        - type: text
                          text: Click here
                          payload: success
              carousel:
                value:
                  from: fb-page-id
                  to: fb-contact-id
                  contents:
                    - type: carousel
                      cardWidth: MEDIUM
                      cards:
                        - title: Card from Zenvia
                          text: This is our products
                          media:
                            url: 'https://zenvia.com/zenvia-office.png'
                            disposition: ON_THE_TOP_MEDIUM_HEIGHT
                            caption: Our amazing office!
                          buttons:
                            - type: link
                              text: Site
                              url: 'https://www.zenvia.com/'
                          quickReplyButtons:
                            - type: text
                              text: Click here
                              payload: success
              replyable_text:
                value:
                  from: fb-page-id
                  to: fb-contact-id
                  contents:
                    - type: replyable_text
                      text: Hi Zenvia!
                      quickReplyButtons:
                        - type: text
                          text: Click here
                          payload: success
              optin_request:
                value:
                  from: fb-page-id
                  to: fb-contact-id
                  contents:
                    - type: optin_request
                      mediaUrl: 'https://zenvia.com/zenvia-office.png'
                      title: Weekly Amazing Deals
                      frequency: WEEKLY
                      reOptIn: ENABLED
                      payload: weekly-deals
                      timezone: America/Sao_Paulo
      responses:
        '200':
          description: Created message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/message.facebook'
        default:
          $ref: '#/components/responses/error'
      x-code-samples:
        - lang: Shell
          label: Bash
          source: |
            curl "https://api.zenvia.com/v2/channels/facebook/messages" \
            -H "Content-Type: application/json" \
            -H "X-API-TOKEN: YOUR_API_TOKEN" \
            -d '{
              "from": "sender-identifier",
              "to": "recipient-identifier",
              "contents": [{
                "type": "text",
                "text": "Some text message"
              }]
            }'
        - lang: JavaScript
          label: Node.js
          source: |
            const { post } = require('request-promise');

            post({
              uri: 'https://api.zenvia.com/v2/channels/facebook/messages',
              headers: {
                'X-API-TOKEN': 'YOUR_API_TOKEN',
              },
              body: {
                from: 'sender-identifier',
                to: 'recipient-identifier',
                contents: [{
                  type: 'text',
                  text: 'Some text message',
                }],
              },
              json: true,
            })
            .then((response) => {
              console.log('Response:', response);
            })
            .catch((error) => {
              console.log('Error:', error);
            });
        - lang: JavaScript
          label: Node.js SDK
          source: |
            /**
             * Example: https://github.com/zenvia/zenvia-sdk-node/blob/master/examples/facebook-send-text-message.js
             */

            import { Client, TextContent } from '@zenvia/sdk';

            const client = new Client('YOUR_API_TOKEN');

            const facebook = client.getChannel('facebook');

            const content = new TextContent('Some text message');

            facebook.sendMessage('sender-identifier', 'recipient-identifier', content)
            .then((response) => {
              console.log('Response:', response);
            })
            .catch((error) => {
              console.log('Error:', error);
            });
        - lang: Java
          label: Java SDK
          source: |
            import com.zenvia.api.sdk.client.Channel;
            import com.zenvia.api.sdk.client.apache.Client;
            import com.zenvia.api.sdk.contents.TextContent;
            import com.zenvia.api.sdk.messages.Message;

            public class FacebookSendTextMessage {

              public static void main (String arg []) {
                Client client = new Client("YOUR_API_TOKEN");

                Channel facebook = client.getChannel("facebook");

                TextContent content = new TextContent("Some text message");

                try {
                  Message response = facebook.sendMessage("sender-identifier", "recipient-identifier", content);
                  System.out.println("Response: " + response.toString());
                } catch(Exception e) {
                  System.out.println("Error: " + e.getMessage());
                }
              }

            }
