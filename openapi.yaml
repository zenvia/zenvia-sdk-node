          CONVERSATION_CREATED: '#/components/schemas/events.conversation-status.statuses.created'
          CONVERSATION_CLOSED: '#/components/schemas/events.conversation-status.statuses.closed'
          CONVERSATION_CLAIMED: '#/components/schemas/events.conversation-status.statuses.claimed'
