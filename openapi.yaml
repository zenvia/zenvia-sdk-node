              type: string
              description: ID of the new user to whom the conversation was transferred
              example: 6786977532d02e8004b485c2
            newGroupId:
              type: string
              description: ID of the new group to which the conversation was transferred
              example: 682f96fdf93dac82cc325a20
            previousUserId:
              type: string
              description: ID of the previous user who handled the conversation
              example: 6786977532d02e8004b485c2
            previousGroupId:
              type: string
              description: ID of the previous group that handled the conversation
              example: 65eb71c89b8c5f8fecd48d88
          required:
            - transferType
            - transferredBy
    events.message-status-code.recorded:
      type: object
      allOf:
        - $ref: '#/components/schemas/events.message-status-base'
        - type: object
          properties:
            code:
              type: string
              example: RECORDED
            details:
              type: object
              description: Details of the call record
              properties:
                file:
                  type: object
                  properties:
                    url:
                      type: string
                      description: URL of the call recording file
                    name:
                      type: string
                      description: Name of the call recording file
                    sizeBytes:
                      type: number
                      description: Size of the call recording file in bytes
                    mimeType:
                      type: string
                      description: Type of the call recording file
          required:
            - code
    events.message-status-code.terminated:
      type: object
      allOf:
        - $ref: '#/components/schemas/events.message-status-base'
        - type: object
          properties:
            code:
              type: string
              example: TERMINATED
            details:
              type: object
              description: Details of the call termination
              properties:
                startTime:
                  type: string
                  description: Start time of the call
                endTime:
                  type: string
                  description: End time of the call
                durationSeconds:
                  type: number
                  description: Duration of the call in seconds
          required:
            - code
    files.file:
      type: object
      allOf:
        - type: object
          properties:
            id:
              title: ID
              description: ID of the file resource created.
              type: string
              example: f8b5a77c7cd3403b08231a1a9c40705717cbc8cab4a9a9e08bf8a5c78905b7d5
              readOnly: true
            url:
              title: URL
              description: URL from where the file content is available.
              type: string
              example: 'https://zenvia.chat/storage/files/f8b5a77c7cd3403b08231a1a9c40705717cbc8cab4a9a9e08bf8a5c78905b7d5.bin'
              readOnly: true
            sourceUrl:
              title: Source URL
              description: URL from where the file content will be obtained.
              type: string
              example: 'https://zenvia.com/example.mp4'
              writeOnly: true
            sourceHeaders:
              title: Source Headers
              description: These headers will be sent in the request to `sourceUrl` to get the file content.
              type: object
              example:
                Authorization: Basic dXNlcjpwd2Q=
                X-Custom-Token: TOKEN
              writeOnly: true
          required:
            - sourceUrl
        - $ref: '#/components/schemas/files.multipart-data'
        - type: object
          properties:
            bytes:
              title: Bytes
              description: Size in bytes of the file content created.
              type: number
              example: 1044889600
              readOnly: true
            createdAt:
              title: Created At
              description: Timestamp of the file creation.
              type: string
              example: '2021-12-20T14:37:59.000Z'
              readOnly: true
            deleteAt:
              title: Delete At
              description: Timestamp of the moment after which the file will be automatically deleted.
              type: string
              example: '2021-12-21T14:37:59.000Z'
              readOnly: true
    files.multipart-data:
      title: File object
      description: This is a file object model.
      type: object
      properties:
        mimeType:
          title: Mime Type
          description: 'Mime type of the file. When not provided, it will be determined based either on the header *Content-Type* or the file name *extension*.'
          type: string
          example: video/mp4
        name:
          title: Name
          description: 'Name of the file. When not provided, it will be obtained from either the header *Content-Disposition* or the URL path.'
          type: string
          example: my-video.mp4
        autoDeleteMinutes:
          title: Auto Delete Minutes
          default: null
          nullable: true
          minimum: 1
          description: |-
            Amount of minutes after which the file will be automatically deleted.
                                <br>The default value, `null`, means the file will be kept until manually deleted.
          type: number
          example: 1440
          writeOnly: true
    flow.batches.aggregated-status:
      title: Aggregated batch status
      description: Detailed status of the batch items
      type: object
      properties:
        successProcessedRecords:
          description: The quantity of records processed with success
          type: number
          example: 1
        timedoutRecords:
          description: The quantity of records in timed out
          type: number
          example: 1
        errorProcessedRecords:
          description: The quantity of records processed with error
          type: number
          example: 1
        canceledRecords:
          description: The quantity of records canceled
          type: number
          example: 1
        processingRecords:
          description: The quantity of records in processing
          type: number
          example: 1
        queuedRecords:
          description: The quantity of records in queue
          type: number
          example: 1
    flow.batches.base:
      title: Flow Batch Status Object
      description: This is a Flow Batch Status object model.
      type: object
      properties:
        id:
          type: string
          description: The flow batch identifier.
          example: 853c2b58-8367-4fcb-8d16-d42208e15942
          readOnly: true
        flowId:
          type: string
          description: 'The the flow identifier. You can view your <a href="https://app.zenvia.com/flows" target="_blank"> Flow IDs here.</a>'
          example: c2c3e42d-6fb7-4ad6-897a-dd7613469f58
        name:
          type: string
          description: The batch name.
          example: Sales campaing
        status:
          description: |-
            The batch status:
                    <br>`LOADING`: Loading the batch
                    <br>`READY`: Batch loaded and ready to be dispatched
                    <br>`QUEUED`: Batch sent to dispatch queue
                    <br>`PROCESSING`: Batch dispatch in progress
                    <br>`WAITING`: Waiting confirmation of the batch status
                    <br>`COMPLETED`: Batch completed
                    <br>`CANCELING`: Batch being canceled
                    <br>`CANCELED`: Batch canceled
                    <br>`TIMEOUT`: Timeout to process the batch
                    <br>`ERROR`: Error to proceed with the batch
          enum:
            - LOADING
            - READY
            - QUEUED
            - PROCESSING
            - WAITING
            - COMPLETED
            - CANCELING
            - CANCELED
            - TIMEOUT
            - ERROR
          type: string
          example: READY
          readOnly: true
        errorCode:
          description: The batch error
          type: string
          enum:
            - ERROR_SAVING_FILE
            - ERROR_INVALID_MEDIA_TYPE
            - ERROR_IN_MEDIA_TYPE_DETECTION
            - ERROR_FILE_NOT_FOUND
            - ERROR_IN_FILE_PROCESSING
            - ERROR_PROCESSING_CONTACTS
            - ERROR_INVALID_BULK_HEADERS
            - ERROR_INVALID_CHARACTER
            - ERROR_INVALID_TELEPHONE_NUMBER
            - ERROR_SEEKING_CONTACTS
            - ERROR_MAX_TPS
            - UNSUPPORTED_CONTENT
            - HEADER_SIZE_MISMATCH
            - INVALID_MESSAGE_FORMAT
            - FLOW_ID_NOT_FOUND
            - GATEWAY_ERROR
            - FLOW_ERROR
            - INVALID_CONTENTS
            - RECIPIENT_NOT_FOUND
            - ERROR_REQUEST_STANDARD_ANSWER
            - RESCHEDULE_PROCESS_ERROR
          example: FLOW_ID_NOT_FOUND
          readOnly: true
        size:
          description: The quantity of recived registers
          type: number
          example: 1
          readOnly: true
        aggregatedStatus:
          type: object
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/flow.batches.aggregated-status'
        progress:
          description: Progress of batch. 0-100
          type: number
          example: 100
          readOnly: true
        schedule:
          type: object
          $ref: '#/components/schemas/flow.batches.schedule'
        createdAt:
          type: string
          description: The created date.
          example: '2021-08-03T16:26:23.616Z'
          readOnly: true
        createdByUserEmail:
          type: string
          description: The creator e-mail
          example: user@mail.com
          readOnly: true
      required:
        - flowId
        - name
    flow.batches.content:
      title: The batch content
      description: The content to be used on dispatch
      type: object
      properties:
        fieldNames:
          description: 'Field names, ignored when containsHeader=true (you can send empty in this case)'
          type: array
          minItems: 1
          items:
            type: string
          example:
            - sms
            - name
            - product
            - deliveryDate
    flow.batches.file:
      title: CSV file properties
      description: Informations about the CSV file
      type: object
      properties:
        name:
          type: string
          description: The file name.
          example: file.csv
          readOnly: true
        containsHeader:
          description: Set true if the file contains the fields names in the header or false if not
          type: boolean
          example: true
        charset:
          description: File headers (CSV)
          type: string
          example: UTF-8
          readOnly: true
      required:
        - containsHeader
    flow.batches.item:
      allOf:
        - $ref: '#/components/schemas/flow.batches.base'
        - type: object
          properties:
            content:
              type: object
              allOf:
                - $ref: '#/components/schemas/flow.batches.content'
              properties:
                file:
                  $ref: '#/components/schemas/flow.batches.file'
    flow.batches.json:
      title: Flow Batch Object for request with json request.
      description: This is a Flow Batch object model for request with json request.
      allOf:
        - $ref: '#/components/schemas/flow.batches.base'
        - type: object
          properties:
            content:
              type: object
              allOf:
                - $ref: '#/components/schemas/flow.batches.content'
                - type: object
                  required:
                    - fieldNames
                    - fields
              properties:
                fields:
                  description: 'A list of field values, each item refers to a contact'
                  type: array
                  minItems: 1
                  items:
                    type: array
                    items:
                      type: string
                  example:
                    - - '5511999999999'
                      - John
                      - Smartphone
                      - 20/07/2021
                    - - '5511911111111'
                      - Paul
                      - Tablet
                      - 21/07/2021
                  writeOnly: true
          required:
            - content
    flow.batches.multipart:
      title: Flow Batch Object for request with file.
      description: This is a Flow Batch object model for request with file.
      allOf:
        - $ref: '#/components/schemas/flow.batches.base'
        - type: object
          properties:
            content:
              type: object
              allOf:
                - $ref: '#/components/schemas/flow.batches.content'
              properties:
                file:
                  $ref: '#/components/schemas/flow.batches.file'
              required:
                - file
          required:
            - content
    flow.batches.schedule:
      title: Batch schedule
      description: Schedule to the batch dispatch
      type: object
      properties:
        start:
          type: string
          description: The schedule start date.
          example: '2021-08-03T16:26:23.616Z'
        end:
          type: string
          description: The schedule end date.
          example: '2021-08-03T16:26:23.616Z'
        limit:
          type: string
          description: The schedule limit date.
          example: '2021-08-03T16:26:23.616Z'
    marketing-automations.marketing-automation-response:
      title: Marketing Automation Response Object
      description: Response from an marketing automation run
      type: object
      properties:
        id:
          type: string
          description: The dispatch identifier
          example: 7388c68e-675e-435b-b2ec-f72677798678
        status:
          type: string
          description: The dispatch status
          example: SENT
        marketingAutomationId:
          type: string
          description: The marketing automation identifier
          example: 5c408dd6-a39a-4eb1-b3b0-bf6f2f34ea39
    marketing-automations.marketing-automation:
      title: Marketing Automation Object
      description: This is a marketing automation object
      type: object
      properties:
        recipientChannels:
          title: Recipient's channels
          description: List of recipient's channels. All channels registered in marketing automation must be provided
          type: object
          minProperties: 1
          properties:
            sms:
              type: string
            whatsapp:
              type: string
            email:
              type: string
            rcs:
              type: string
          additionalProperties: false
          example:
            sms: '5511999999999'
            email: email@email.com
        variables:
          title: Variables
          description: Variables list registered in automation steps. All variables registered in marketing automation must be provided
          type: object
          additionalProperties:
            type: string
          example:
            name: John Doe
            birthdate: 01/01/1979
      required:
        - recipientChannels
    message.all:
      type: object
      title: Message
      description: Message sent by the contact
      allOf:
        - $ref: '#/components/schemas/message.base'
        - type: object
          properties:
            visitor:
              $ref: '#/components/schemas/message.visitor'
            referral:
              $ref: '#/components/schemas/message.referral'
            contents:
              items:
                $ref: '#/components/schemas/content.all'
            idRef:
              title: Referenced Message ID
              description: |-
                When a user sends a message quoting a previous message, the identifier of the quoted message will be provided here. Also:
                * On reply button clicks (see [replyable text](#section/Replyable-Text) and [card](#section/Card) sections), this will refer to the ID of the clicked message.
                * On [SMS](#tag/SMS) channel, this will refer to the ID of the last message sent to the contact.

                *Only applicable to [WhatsApp](#tag/WhatsApp), [Instagram](#tag/Instagram), [SMS](#tag/SMS), [Facebook](#tag/Facebook), [RCS](#tag/RCS) and [E-Mail](#tag/E-Mail) channels.*
              type: string
              readOnly: true
    message.allMo:
      type: object
      title: Message
      description: Message sent by the contact
      allOf:
        - $ref: '#/components/schemas/message.baseMo'
        - type: object
          properties:
            visitor:
              $ref: '#/components/schemas/message.visitor'
            referral:
              $ref: '#/components/schemas/message.referral'
            contents:
              items:
                $ref: '#/components/schemas/content.all'
            idRef:
              title: Referenced Message ID
              description: |-
                When a user sends a message quoting a previous message, the identifier of the quoted message will be provided here. Also:
                * On reply button clicks (see [replyable text](#section/Replyable-Text) and [card](#section/Card) sections), this will refer to the ID of the clicked message.
                * On [SMS](#tag/SMS) channel, this will refer to the ID of the last message sent to the contact.

                *Only applicable to [WhatsApp](#tag/WhatsApp), [Instagram](#tag/Instagram), [SMS](#tag/SMS), [Facebook](#tag/Facebook), [RCS](#tag/RCS) and [E-Mail](#tag/E-Mail) channels.*
              type: string
              readOnly: true
    message.base:
      title: Message Object
      description: This is a Message object model
      type: object
      properties:
        id:
          title: Message ID
          description: An ID for the message. It can be used for future message consulting or callback notifications.
          type: string
          readOnly: true
        externalId:
          title: Message External ID
          description: 'A customizable identifier for dispatches, allowing users to customize and track their dispatches within the API'
          type: string
        from:
          title: Sender ID
          description: |-
            The identifier of the sender of the message. The sender is created when an integration for the channel is connected
                    on the [integrations console](https://app.zenvia.com/home/credentials).
                    <br>More details on the channel's *sender and recipient* section.
          type: string
          minLength: 1
          maxLength: 64
        to:
          title: Recipient ID
          description: |-
            The identifier of the recipient (varies according to the channel) of the message.
                    <br>More details on the channel's *sender and recipient* section.
          type: string
          minLength: 1
          maxLength: 64
        direction:
          title: Message direction
          description: Indicates whether the message is received from a channel (IN) or sent to a channel (OUT)
          type: string
          enum:
            - IN
            - OUT
          readOnly: true
        channel:
          title: Message channel
          description: Message channel
          type: string
          readOnly: true
        contents:
          title: Message Contents
          description: The list of contents to be sent
          type: array
          items:
            type: object
          minItems: 1
        timestamp:
          title: Message timestamp
          description: Timestamp of the message. Usually received from the provider of the channel.
          type: string
          format: date-time
          readOnly: true
      required:
        - from
        - to
        - contents
