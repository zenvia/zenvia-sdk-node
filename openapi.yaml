    message.referral:
      title: Referral Object
      description: |-
        Included in notifications where it is possible to track the source of the message. Examples:
        * When a user clicks on an ad that redirects to WhatsApp and sends a message to the business
        * When a user tags the business on their Instagram story
        * When a user replies to a Instagram story from the business
        * When a user quotes an message in the Instagram direct conversation

        *Only applicable to [WhatsApp](#tag/WhatsApp) and [Instagram](#tag/Instagram) channels.*
      type: object
      properties:
        headline:
          title: Headline
          description: |-
            Headline used in the ad that generated the message.
                                <br>*Only applicable to [WhatsApp](#tag/WhatsApp) channel.*
          type: string
          example: This is a headline
        body:
          title: Body
          description: |-
            Body from the ad that generated the message.
                                <br>*Only applicable to [WhatsApp](#tag/WhatsApp) channel.*
          type: string
          example: This is a body
        source:
          type: object
          title: Referral source
          description: Provide details about the source of the message.
          properties:
            id:
              title: Id
              description: An id for the message source. The format of the id will depend on the source type.
              type: string
            type:
              title: Type
              description: The type of content where the message originated.
              type: string
              enum:
                - ad
                - post
                - story_mention
                - sharing
                - story
                - message
                - live
            url:
              title: URL
              description: The URL that leads to the message source. Opening this URL takes you to the content viewed by the user.
              type: string
              example: 'https://www.zenvia.com'
            text:
              title: Text
              description: |-
                The content of the quoted text message.
                                        <br>*Only applicable to [Instagram](#tag/Instagram) channel.*
              type: string
            user:
              title: User
              description: |-
                The user who sent the quoted text message.
                                        <br>*Only applicable to [Instagram](#tag/Instagram) channel.*
              type: string
            timestamp:
              title: Timestamp
              description: |-
                The timestamp of the quoted text message.
                                        <br>*Only applicable to [Instagram](#tag/Instagram) channel.*
              type: string
        ctwaId:
          title: Click ID
          description: |-
            Click ID generated by Meta for ads that click to WhatsApp.
                                <br>*Only applicable to [WhatsApp](#tag/WhatsApp) channel.*
          type: string
          example: '12345'
    message.representative:
      title: Representative Object
      description: |-
        Provides information on the representative who sent the message.
                        <br>It is mainly meant to be used when a **human agent** is the message's sender.
                        <br><br>*Only applicable to [Instagram](#tag/Instagram), [Google Business Messages](#tag/Google-Business-Messages) and [E-Mail](#tag/E-Mail) channels.*
      type: object
      properties:
        type:
          title: Type
          description: |-
            Indicates whether the message sender is a *bot* or a *human agent*.
                                <br>The `HUMAN` value must only be used on a message coming from a **human agent**.
                                <br><br>*Only applicable to [Instagram](#tag/Instagram) and [Google Business Messages](#tag/Google-Business-Messages) channels.*
          type: string
          enum:
            - BOT
            - HUMAN
          default: BOT
          example: HUMAN
        name:
          title: Name
          description: |-
            Representative's name shown on the message.
                                <br>*Only applicable to [Google Business Messages](#tag/Google-Business-Messages) and [E-Mail](#tag/E-Mail) channels.*
          type: string
          example: Agent name
        picture:
          title: Picture
          description: |-
            URL for the avatar picture of the representative message.
                                <br>*Only applicable to [Google Business Messages](#tag/Google-Business-Messages) channel.*
          type: string
          example: 'https://zenvia.com/favicon.ico'
    message.sms:
      type: object
      allOf:
        - $ref: '#/components/schemas/message.base'
        - type: object
          properties:
            contents:
              title: Message Contents
              description: A list of content to be sent
              type: array
              items:
                $ref: '#/components/schemas/content.sms.all'
              minItems: 1
            conversation:
              $ref: '#/components/schemas/content.conversation'
    message.telegram:
      type: object
      allOf:
        - $ref: '#/components/schemas/message.base'
        - type: object
          properties:
            contents:
              title: Message Contents
              description: A list of content to be sent
              type: array
              items:
                $ref: '#/components/schemas/content.telegram.all'
              minItems: 1
            conversation:
              $ref: '#/components/schemas/content.conversation'
    message.visitor:
      title: Visitor Object
      description: |-
        It provides information about the contact who sent the message.
                        <br>The availability of this information depends on privacy settings of the contact.
                        <br><br>*Only applicable to [WhatsApp](#tag/WhatsApp), [Instagram](#tag/Instagram),
                        [Facebook](#tag/Facebook), [Telegram](#tag/Telegram), [Google Business Messages](#tag/Google-Business-Messages)
                        and [E-Mail](#tag/E-Mail) channels.*
      type: object
      properties:
        name:
          title: Name
          description: Full name of the contact.
          type: string
        firstName:
          title: First name
          description: |-
            First name of the contact.
                                <br>*Only applicable to [WhatsApp](#tag/WhatsApp), [Facebook](#tag/Facebook) and [Telegram](#tag/Telegram) channels.*
          type: string
        lastName:
          title: Last name
          description: |-
            Last name of the contact.
                                <br>*Only applicable to [WhatsApp](#tag/WhatsApp), [Facebook](#tag/Facebook) and [Telegram](#tag/Telegram) channels.*
          type: string
        userName:
          title: User name
          description: |-
            User name of the contact.
                                <br>*Only applicable to [Instagram](#tag/Instagram) channel.*
          type: string
        picture:
          title: Picture
          description: |-
            URL for the profile picture of the contact.
                                <br>*Only applicable to [Instagram](#tag/Instagram) and [Facebook](#tag/Facebook) channels.*
          type: string
    message.voice:
      type: object
      allOf:
        - $ref: '#/components/schemas/message.base'
        - type: object
          properties:
            contents:
              title: Message Contents
              description: A list of content to be sent
              type: array
              items:
                $ref: '#/components/schemas/content.voice.all'
              minItems: 1
    message.whatsapp:
      type: object
      allOf:
        - $ref: '#/components/schemas/message.base'
        - type: object
          properties:
            contents:
              title: Message Contents
              description: A list of content to be sent
              type: array
              items:
                $ref: '#/components/schemas/content.whatsapp.mt'
              minItems: 1
            idRef:
              type: string
              description: |-
                Id of the message sent or received in the conversation channel to reference as a message reply.
                        <br>*Only applicable to [WhatsApp](#tag/WhatsApp) channel.*
              example: 7390113b-e120-41b5-8a07-c4567726abc2
            contentRef:
              type: number
              description: |-
                Index of the content in the message sent or received in the conversation channel to reference as a message reply.
                        <br>If ommited, the index to reference will be `0` (the first content of the message).
                        <br>*Only applicable to [WhatsApp](#tag/WhatsApp) channel.*
              default: 0
              example: 1
            conversation:
              $ref: '#/components/schemas/content.conversation'
    partners-batches.batch-create-response:
      type: object
      description: Represents the imported batch.
      properties:
        id:
          type: string
          description: The unique identifier for the import record.
          example: dc514337-14c4-4f53-947b-93088b450e2e
        organizationId:
          type: string
          description: The unique identifier of the organization the import belongs to.
          example: a49c0383-57b1-4627-bfaa-6019b7e7fe53
        fileName:
          type: string
          description: The name of the imported file.
          example: Contacts - Batch 1
        fileUrl:
          type: string
          description: The uploaded file's url.
          example: 'https://chat.zenvia.com/storage/folders/a1b2c3d4-e5f6-a7b8-c9d0-e1f2a3b4c5d6/files/c4a4e9a1-2c9c-4d3a-8f7b-9b4e2e0d1f3e.bin'
        status:
          type: string
          description: The final status of the file processing.
          enum:
            - SUCCESS
            - PENDING
            - FAILED
          example: SUCCESS
        createdAt:
          type: string
          description: 'The date and time the record was created, in ISO 8601 format.'
          example: '2025-04-23T18:42:50.325Z'
    partners-batches.batch-list-response:
      type: object
      description: Represents a batch of contacts for processing.
      properties:
        id:
          type: string
          description: The unique identifier for the batch.
          example: c4a4e9a1-2c9c-4d3a-8f7b-9b4e2e0d1f3e
        organizationId:
          type: string
          description: The ID of the organization the batch belongs to.
          example: a1b2c3d4-e5f6-a7b8-c9d0-e1f2a3b4c5d6
        fileName:
          type: string
          description: The original name of the uploaded file.
          example: contacts_q3_2025.csv
        fileUrl:
          type: string
          description: The uploaded file's url.
          example: 'https://chat.zenvia.com/storage/folders/a1b2c3d4-e5f6-a7b8-c9d0-e1f2a3b4c5d6/files/c4a4e9a1-2c9c-4d3a-8f7b-9b4e2e0d1f3e.bin'
        fileExpireAt:
          type: string
          description: 'The expiration date and time for file access, in ISO 8601 format. (Default of 10 days)'
          example: '2025-08-06T23:59:59.000Z'
        lines:
          type: number
          description: The number of lines or records in the file.
          example: 1000
        status:
          type: string
          description: The current processing status of the batch.
          enum:
            - SUCCESS
            - PENDING
            - FAILED
          example: SUCCESS
        feedbackUrl:
          type: string
          description: The uploaded file's feedback url.
          example: 'https://chat.zenvia.com/storage/folders/a1b2c3d4-e5f6-a7b8-c9d0-e1f2a3b4c5d6/files/4094d16af43dea0fcba63bcb217b60b07cb9e46dfa1f22b1f965ea2b433871ea.bin'
        feedbackExpireAt:
          type: string
          description: 'The expiration date and time for file access, in ISO 8601 format. (Default of 10 days)'
          example: '2025-08-06T23:59:59.000Z'
        consolidatedStatus:
          type: object
          description: Describes the consolidated status of the batch processing. (Only showed when `status` is `SUCCESS` or `FAILED`.)
          properties:
            extractedRecords:
              type: number
              description: The number of records extracted from the original file.
              example: 1000
            mappedRecords:
              type: number
              description: The number of records successfully mapped to the expected format.
              example: 1000
            successProcessedRecords:
              type: number
              description: The number of records that were successfully processed and saved.
              example: 990
            errorProcessedRecords:
              type: number
              description: The number of records that failed during processing.
              example: 10
        createdAt:
          type: string
          description: 'The creation date and time of the batch, in ISO 8601 format.'
          example: '2025-07-30T19:55:42.321Z'
        updatedAt:
          type: string
          description: 'The date and time of the last update to the batch, in ISO 8601 format.'
          example: '2025-07-30T19:56:10.123Z'
