    content.whatsapp.order-details-template:
      title: Order Details
      required:
        - orderDetailsParameters
      additionalProperties:
        description: Value provided to fill the variable named after the property name.
        oneOf:
          - type: string
            example: Zenvia
          - type: number
            example: 1
          - type: boolean
            example: true
      properties:
        orderDetailsParameters:
          type: object
          description: |-
            Details of a payment template.

             *Only applicable to [WhatsApp](#tag/WhatsApp) channel.*
          required:
            - order
            - totalAmount
            - type
            - paymentSettings
          properties:
            referenceId:
              type: string
              description: 'An optional unique identifier of the order. This can only contain English letters, numbers, underscores, dashes, or dots.'
              maxLength: 35
              pattern: '^[A-Za-z0-9_\-\.]+$'
            type:
              type: string
              enum:
                - digital_goods
                - physical_goods
              description: The type of the order item.
            paymentSettings:
              type: array
              description: List of payment configuration objects.
              minItems: 1
              maxItems: 2
              items:
                type: object
                anyOf:
                  - title: Payment link
                    required:
                      - paymentLink
                      - type
                    properties:
                      type:
                        description: The type of the payment method.
                        enum:
                          - payment_link
                        type: string
                      paymentLink:
                        description: A valid payment URL.
                        pattern: '^(https)://[^\s/$.?#].[^\s]*$'
                        type: string
                  - title: Boleto
                    required:
                      - digitableLine
                      - type
                    properties:
                      type:
                        description: The type of the payment method.
                        enum:
                          - boleto
                        type: string
                      digitableLine:
                        description: 'The Boleto digitable line / code which will be copied to the clipboard, when user taps on the Boleto CTA button.'
                        minLength: 47
                        maxLength: 48
                        type: string
                  - title: Pix
                    required:
                      - code
                      - merchantName
                      - key
                      - keyType
                      - type
                    properties:
                      type:
                        enum:
                          - pix_dynamic_code
                        type: string
                        description: 'The type of the payment method. For ''pix_dynamic_code'', Pix payment instructions that will be displayed to buyers during the checkout process if they decide to pay outside of WhatsApp.'
                      code:
                        type: string
                        description: The dynamic Pix code to be sent to the buyer.
                      merchantName:
                        type: string
                        description: The name of account holder. Displayed in-app for the buyer for informational purposes.
                      key:
                        type: string
                        description: The Pix key.
                      keyType:
                        type: string
                        description: The type of the Pix key.
                        enum:
                          - CPF
                          - CNPJ
                          - EMAIL
                          - PHONE
                          - EVP
            totalAmount:
              type: number
              description: The total amount of the order in BRL with up to two decimal places.
              example: 12.34
              minimum: 0.01
            order:
              type: object
              required:
                - items
                - tax
                - subtotal
              description: 'Details of the purchase order containing items purchased, subtotal amount, and tax details.'
              properties:
                items:
                  type: array
                  description: 'List of products included in the order, with details for each item.'
                  items:
                    type: object
                    required:
                      - productId
                      - name
                      - amount
                      - quantity
                    properties:
                      productId:
                        type: string
                        description: The product item catalog identifier.
                      name:
                        type: string
                        description: The name of the item to be displayed to the user.
                        maxLength: 60
                      amount:
                        type: number
                        description: The price per item in BRL with up to two decimal places.
                        example: 12.34
                        minimum: 0.01
                      quantity:
                        type: number
                        description: The quantity of the item in this order.
                        minimum: 0
                tax:
                  type: object
                  description: Tax details applied to the purchase.
                  required:
                    - value
                  properties:
                    value:
                      type: number
                      description: The total value of the tax in BRL with up to two decimal places.
                      example: 12.34
                      minimum: 0
                subtotal:
                  type: number
                  description: The total value of the order in BRL with up to two decimal places.
                  example: 12.34
                  minimum: 0.01
    content.whatsapp.order-details:
      type: object
      allOf:
        - $ref: '#/components/schemas/content.base'
        - type: object
          properties:
            type:
              type: string
              example: order_details
            body:
              type: string
              description: Body content
              example: Text body content
              maxLength: 1024
            footer:
              type: string
              description: Footer content
              example: Text footer content
              maxLength: 60
            parameters:
              type: object
              properties:
                referenceId:
                  type: string
                  description: 'The unique identifier of the order. This cannot be an empty string and can only contain English letters, numbers, underscores, dashes, or dots. If not specified, we will generate a random identifier and return it in the request response.'
                  maxLength: 35
                  pattern: '^[A-Za-z0-9_\-\.]+$'
                type:
                  type: string
                  description: The type of the order item.
                  enum:
                    - digital_goods
                    - physical_goods
                paymentSettings:
                  type: array
                  description: List of payment configuration objects.
                  minItems: 1
                  maxItems: 2
                  items:
                    anyOf:
                      - $ref: '#/components/schemas/content.whatsapp.payment-settings.pix'
                      - $ref: '#/components/schemas/content.whatsapp.payment-settings.boleto'
                      - $ref: '#/components/schemas/content.whatsapp.payment-settings.payment-link'
                totalAmount:
                  type: number
                  description: The total amount of the order in BRL with up to two decimal places.
                  example: 12.34
                  minimum: 0.01
                order:
                  type: object
                  properties:
                    catalogId:
                      type: string
                      description: 'The catalog identifier. Click <a href="https://business.facebook.com/commerce" target="_blank">here</a> to go to the catalogs page.'
                    expiration:
                      type: object
                      description: The expiration for that order. The CTA for payment will be disabled after expiry on the user end.
                      properties:
                        timestamp:
                          type: string
                          description: The timestamp UTC time in seconds. Minimum threshold is 300 seconds.
                          pattern: ^\d+$
                        description:
                          type: string
                          description: The description explaining when the order will expire.
                          maxLength: 120
                      required:
                        - timestamp
                        - description
                    items:
                      type: array
                      description: The list of items that will be ordered.
                      minItems: 1
                      items:
                        type: object
                        properties:
                          productId:
                            type: string
                            description: The product item catalog identifier.
                          name:
                            type: string
                            description: The name of the item to be displayed to the user.
                            maxLength: 60
                          amount:
                            type: number
                            description: The price per item in BRL with up to two decimal places.
                            example: 12.34
                            minimum: 0.01
                          quantity:
                            type: number
                            description: The quantity of the item in this order.
                            minimum: 0
                          saleAmount:
                            type: number
                            description: The discounted price per item.
                            minimum: 0
                        required:
                          - productId
                          - name
                          - amount
                          - quantity
                    subtotal:
                      type: number
                      description: The total value of the order in BRL with up to two decimal places.
                      example: 12.34
                      minimum: 0.01
                    tax:
                      type: object
                      properties:
                        value:
                          type: number
                          description: The total value of the tax in BRL with up to two decimal places.
                          example: 12.34
                          minimum: 0
                        description:
                          type: string
                          description: The optional description of the tax.
                          maxLength: 60
                      required:
                        - value
                    shipping:
                      type: object
                      properties:
                        value:
                          type: number
                          description: The total value of the shipping cost in BRL with up to two decimal places.
                          example: 12.34
                          minimum: 0.01
                        description:
                          type: string
                          description: The optional description of the shipping cost.
                      required:
                        - value
                    discount:
                      type: object
                      properties:
                        value:
                          type: number
                          description: The total value of the discount in BRL with up to two decimal places.
                          example: 12.34
                          minimum: 0.01
                        description:
                          type: string
                          description: The optional description of the discount.
                          maxLength: 60
                        discountProgramName:
                          type: string
                          description: 'The text used for defining incentivised orders. If order is incentivised, the merchant needs to define this information'
                          maxLength: 60
                      required:
                        - value
                  required:
                    - items
                    - subtotal
                    - tax
              required:
                - type
                - paymentSettings
                - totalAmount
                - order
          required:
            - type
            - body
            - parameters
    content.whatsapp.order-status:
