                  - $ref: '#/components/schemas/templates.components.carousel.buttons.actions'
                  - $ref: '#/components/schemas/templates.components.carousel.buttons.quick-replies'
                  - $ref: '#/components/schemas/templates.components.carousel.buttons.mixed'
